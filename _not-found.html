<!DOCTYPE html>
<html lang="en-AE">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,follow"/>
  <meta name="description" content="The requested James Realty page could not be found. Return to the homepage or open the UAE property data and enquiry pages."/>
  <meta name="theme-color" content="#0a0a1a"/>
  <title>Page Not Found | James Realty</title>
  <link rel="icon" href="/favicon.svg"/>
  <link rel="apple-touch-icon" href="/favicon-192.png"/>
  <style>
    :root{color-scheme:dark;--ink:#0a0a1a;--surface:#12122b;--line:#34345f;--text:#eef0f8;--muted:#a5a6b8;--accent:#818cf8}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,rgba(129,140,248,.16),transparent 28rem),var(--ink);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(660px,100%);padding:clamp(30px,7vw,54px);border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,rgba(129,140,248,.10),transparent 58%),var(--surface);box-shadow:0 30px 90px rgba(0,0,0,.42)}.eyebrow{margin:0 0 14px;color:#aebfff;font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:clamp(2.7rem,9vw,5.4rem);line-height:.96;letter-spacing:-.06em}p{max-width:540px;margin:22px 0 0;color:var(--muted);font-size:1rem;line-height:1.72}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border:1px solid var(--accent);border-radius:999px;color:var(--text);text-decoration:none;font-size:.84rem;font-weight:750}a:first-child{background:var(--accent);color:var(--ink)}a:focus-visible{outline:3px solid #aebfff;outline-offset:4px}@media(max-width:480px){.actions{display:grid}.actions a{width:100%}}
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Error 404</p>
    <h1>Page not found.</h1>
    <p>The page may have moved, or the address may be incorrect. Continue from the James Realty homepage or open the Dubai property data dashboard.</p>
    <div class="actions">
      <a href="/">Go to homepage</a>
      <a href="/dubai-data/">Open Dubai Data</a>
    </div>
  </main>
</body>
</html>
