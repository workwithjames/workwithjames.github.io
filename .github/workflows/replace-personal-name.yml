name: Replace personal name across website

on:
  push:
    paths:
      - '.automation/replace-james-name'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace exact personal name
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          root = Path('.')
          target = 'James' + ' Ravi'
          replacement = 'James'
          chunk_dir = Path('.automation/property-news-script')
          chunks = sorted(chunk_dir.glob('chunk-*.txt'))
          chunk_paths = set(chunks)
          changed = []

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path in chunk_paths:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if target in text:
                  path.write_text(text.replace(target, replacement), encoding='utf-8')
                  changed.append(str(path))

          if chunks:
              encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
              script = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
              updated = script.replace(target, replacement)
              if updated != script:
                  packed = base64.b64encode(gzip.compress(updated.encode('utf-8'), mtime=0)).decode('ascii')
                  chunk_size = max(60000, max(len(path.read_text(encoding='utf-8').strip()) for path in chunks))
                  pieces = [packed[i:i + chunk_size] for i in range(0, len(packed), chunk_size)]
                  for index, piece in enumerate(pieces):
                      (chunk_dir / f'chunk-{index:03d}.txt').write_text(piece + '\n', encoding='utf-8')
                  for path in chunks[len(pieces):]:
                      path.unlink()
                  changed.append(str(chunk_dir))

          Path('.automation/replace-james-name').unlink(missing_ok=True)
          Path('.github/workflows/replace-personal-name.yml').unlink(missing_ok=True)
          print(f'Updated {len(changed)} website files or templates.')
          PY

      - name: Verify replacement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          target = 'James' + ' Ravi'
          matches = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.automation/property-news-script' in str(path):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if target in text:
                  matches.append(str(path))
          if matches:
              raise SystemExit('Remaining matches: ' + ', '.join(matches))
          print('No remaining exact-name matches in website text files.')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update personal name across website"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
