name: Apply landing form v2
on:
  push:
    paths:
      - '.github/workflows/apply-landing-form-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Add optimized form assets to all landing pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pages=['emaar','aldar','damac','binghatti','nakheel','mudon','uk','usa','india','ar']
          css='<link rel="stylesheet" href="https://jamesrealty.uk/assets/landing-form-v2.css?v=1">'
          js='<script src="https://jamesrealty.uk/assets/landing-form-v2.js?v=1" defer></script>'
          changed=[]
          for name in pages:
              p=Path('landing')/name/'index.html'
              if not p.exists(): raise SystemExit(f'Missing landing page: {p}')
              s=p.read_text(encoding='utf-8')
              if 'data-lead-capture' not in s or 'class="jr-form"' not in s:
                  raise SystemExit(f'Expected lead form not found in {p}')
              if css not in s:
                  s=s.replace('</head>',css+'</head>',1)
              if js not in s:
                  s=s.replace('</body>',js+'</body>',1)
              p.write_text(s,encoding='utf-8')
              changed.append(str(p))
          print('FORM_V2_PAGES|'+'|'.join(changed))
          PY
      - name: Commit landing form rollout
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add landing/*/index.html
          git commit -m 'Roll out optimized contact forms across landing pages'
          git push origin HEAD:main
