name: Verify UK compact final
on:
  push:
    paths:
      - '.github/workflows/verify-uk-compact-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Wait for refreshed public page
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            html=$(curl -fsSL --max-time 25 "https://dubai.jamesrealty.uk/?compact=$RANDOM-$i" || true)
            css=$(curl -fsSL --max-time 25 "https://jamesrealty.uk/assets/uk-premium.css?v=1&compact=$RANDOM-$i" || true)
            if printf '%s' "$html" | grep -q 'Binghatti Skyflame' && printf '%s' "$css" | grep -q 'min-height:min(780px,86svh)'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Render and record geometry
        shell: bash
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9223 about:blank >/tmp/chrome2.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:9223/json/version >/dev/null 2>&1 && break; sleep 1; done
          cat > /tmp/measure.mjs <<'JS'
          import fs from 'node:fs';
          const base='http://127.0.0.1:9223';
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function read(width,height){
            const r=await fetch(base+'/json/new?'+encodeURIComponent('https://dubai.jamesrealty.uk/?compact-render='+Date.now()),{method:'PUT'});const t=await r.json();
            const ws=new WebSocket(t.webSocketDebuggerUrl);await new Promise((ok,no)=>{ws.addEventListener('open',ok,{once:true});ws.addEventListener('error',no,{once:true});});let id=1;
            const send=(method,params={})=>new Promise((ok,no)=>{const mid=id++;const h=e=>{const m=JSON.parse(e.data);if(m.id===mid){ws.removeEventListener('message',h);m.error?no(new Error(JSON.stringify(m.error))):ok(m.result);}};ws.addEventListener('message',h);ws.send(JSON.stringify({id:mid,method,params}));});
            await send('Runtime.enable');await send('Page.enable');await send('Emulation.setDeviceMetricsOverride',{width,height,deviceScaleFactor:1,mobile:false});await send('Page.navigate',{url:'https://dubai.jamesrealty.uk/?compact-render='+Date.now()});await wait(2500);
            const expression=`(()=>{const h=s=>[...document.querySelectorAll(s)].map(e=>Math.round(e.getBoundingClientRect().height));return {title:document.querySelector('h1')?.textContent||'',text:document.body.innerText,overflow:document.documentElement.scrollWidth-window.innerWidth,hero:h('.jr-hero'),facts:h('.jr-facts article'),tool:h('.jr-tool form'),projectBodies:h('.jr-project__body'),routes:h('.uk-route-grid article'),costs:h('.uk-cost-grid article'),locations:h('.uk-location-grid article'),lens:h('.jr-lens__grid article'),process:h('.jr-process__rail li'),form:h('.jr-form'),iframes:document.querySelectorAll('iframe').length};})()`;
            const out=await send('Runtime.evaluate',{expression,returnByValue:true});ws.close();return out.result.value;
          }
          const desktop=await read(1440,1000),mobile=await read(390,844),max=a=>a?.length?Math.max(...a):0;
          const checks={hero:desktop.title.includes('underwritten in pounds'),projects:desktop.text.includes('Binghatti Skyflame')&&desktop.text.includes('Golf Vale')&&desktop.text.includes('Creek Bay'),noCanopies:!desktop.text.includes('The Canopies'),noMap:desktop.iframes===0,desktopOverflow:desktop.overflow<=2,mobileOverflow:mobile.overflow<=2,desktopHero:max(desktop.hero)<=830,mobileHero:max(mobile.hero)<=820,projectBodies:max(desktop.projectBodies)<=520,routes:max(desktop.routes)<=280,costs:max(desktop.costs)<=260,locations:max(desktop.locations)<=250,lens:max(desktop.lens)<=170,process:max(desktop.process)<=190};
          const report={checked_at:new Date().toISOString(),pass:Object.values(checks).every(Boolean),checks,desktop,mobile};fs.mkdirSync('.github/qa',{recursive:true});fs.writeFileSync('.github/qa/uk-premium-compact-final.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));if(!report.pass)process.exit(1);
          JS
          node /tmp/measure.mjs
      - name: Save report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f .github/qa/uk-premium-compact-final.json ]; then
            git add .github/qa/uk-premium-compact-final.json
            git commit -m 'Record compact final UK landing QA' || exit 0
            git pull --rebase origin main
            git push origin HEAD:main
          fi
