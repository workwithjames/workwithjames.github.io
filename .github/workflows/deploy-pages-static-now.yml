name: Deploy static site to Pages
# Deploy refreshed UK investor landing: 2026-08-18
on:
  push:
    paths:
      - '.github/workflows/deploy-pages-static-now.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-direct
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare static site artifact
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='_site' \
            ./ _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  record:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Record successful Pages deployment
        shell: bash
        run: |
          mkdir -p .github/qa
          cat > .github/qa/landing-form-v2-deployment.txt <<EOF
          status=success
          workflow_sha=${GITHUB_SHA}
          page_url=${{ needs.deploy.outputs.page_url }}
          deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/qa/landing-form-v2-deployment.txt
          git commit -m 'Record landing form Pages deployment' || exit 0
          git push origin HEAD:main
