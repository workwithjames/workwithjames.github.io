name: Bump Mudon stylesheet v2
on:
  push:
    paths:
      - '.github/workflows/bump-mudon-css-v2.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('landing/mudon/index.html')
          s=p.read_text(encoding='utf-8').replace('mudon-premium.css?v=1','mudon-premium.css?v=2')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add landing/mudon/index.html
          git commit -m 'Bump Mudon premium stylesheet cache key'
          git push origin HEAD:main
