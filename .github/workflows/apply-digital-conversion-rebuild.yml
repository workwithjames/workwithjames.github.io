          (root/'book-call.html').write_text(shell('Book a Call','Request a focused project call with James Digital in your timezone.',call_body,'book-call-page'),encoding='utf-8')

          # Solutions hub and dedicated problem routes.
          solutions={
            'more-qualified-leads':('More Qualified Leads','Build qualified demand instead of optimising for cheap form fills.','Acquisition, landing-page clarity, measurement and downstream sales feedback are treated as one system.'),
            'website-not-converting':('Website Not Converting','Turn a visually acceptable website into a clearer buying journey.','Message hierarchy, proof, friction, CTA architecture, mobile usability and tracking are reviewed together.'),
            'fragmented-marketing':('Fragmented Marketing','Replace disconnected channel activity with one commercial operating plan.','Priorities, suppliers, campaigns, content, measurement and CRM are organised around the same customer journey.'),
            'lead-follow-up':('Lead Follow-up','Stop losing demand after the form is submitted.','Lead stages, routing, ownership, response visibility, automation and sales feedback are mapped end to end.'),
            'new-website':('New Website','Build a commercial website around what the customer needs to decide.','Positioning, information architecture, responsive delivery, conversion paths and measurement are defined before decoration.'),
            'international-growth':('International Growth','Prioritise markets and acquisition paths before scaling spend.','Market logic, localised messaging, channel selection, landing journeys and remote delivery are structured by evidence.')
          }
          hub_cards=''.join(f'<a href="/solutions/{slug}.html"><small>{i:02d}</small><h3>{t}</h3><p>{d}</p></a>' for i,(slug,(t,_,d)) in enumerate(solutions.items(),1))
          hub='''<section class="page-hero section-shell"><div><p class="eyebrow"><span></span> Solutions</p><h1>Start with the business problem, not the service menu.</h1><p>Choose the situation closest to what is happening now. Each route explains the diagnosis, likely workstreams and the evidence needed before a larger commitment.</p></div></section><section class="conversion-section section-shell"><div class="solution-grid">'''+hub_cards+'''</div></section>'''
          (root/'solutions.html').write_text(shell('Solutions','Problem-based digital growth routes for leads, conversion, websites, CRM and international growth.',hub),encoding='utf-8')
          sol_dir=root/'solutions';sol_dir.mkdir(exist_ok=True)
          for slug,(title,headline,desc) in solutions.items():
              body=f'''<section class="page-hero section-shell"><div><p class="eyebrow"><span></span> Solution / {title}</p><h1>{headline}</h1><p>{desc}</p><div class="hero-actions"><a class="button button-primary" href="/start-project.html?objective={quote(title)}">Discuss this problem</a><a class="button button-ghost" href="/portfolio.html">See Relevant Work</a></div></div><aside class="service-outcome"><span>Working rule</span><p>Diagnosis comes before the channel list. The smallest sensible scope is recommended first.</p></aside></section><section class="conversion-section section-shell"><div class="buying-grid"><article><span>01</span><h3>Diagnose</h3><p>Map current performance, friction, evidence and constraints.</p></article><article><span>02</span><h3>Prioritise</h3><p>Identify the highest-value fixes and dependencies.</p></article><article><span>03</span><h3>Deliver</h3><p>Implement the defined workstreams with clear ownership.</p></article><article><span>04</span><h3>Measure</h3><p>Track the best available leading and commercial indicators.</p></article></div></section><section class="section final-cta"><div class="section-shell final-cta-inner"><p class="kicker">Next step</p><h2>Share what is happening now and what needs to change.</h2><div><a class="button button-light" href="/start-project.html?objective={quote(title)}">Discuss this problem</a><a class="button button-outline-light" href="/book-call.html">Book a Call</a></div></div></section>'''
              (sol_dir/(slug+'.html')).write_text(shell(title,desc,body),encoding='utf-8')

          # Industries hub and added B2B / retail routes.
          industries=[('real-estate','Real Estate','High-consideration demand, project launches, investor journeys and sales feedback.'),('hospitality','Hospitality','Discovery, reservation intent, local search, offers and repeat demand.'),('beauty-lifestyle','Beauty & Lifestyle','Local discovery, appointments, offers, retention and brand consistency.'),('professional-services','Professional Services','Trust, expertise, qualified enquiries and longer buying cycles.'),('b2b','B2B','Complex offers, longer sales cycles, lead quality and CRM visibility.'),('retail','Retail','Product discovery, campaign conversion, store or ecommerce journeys and retention.')]
          cards=''.join(f'<a href="/industries/{s}.html"><small>{i:02d}</small><h3>{t}</h3><p>{d}</p></a>' for i,(s,t,d) in enumerate(industries,1))
          ibody='''<section class="page-hero section-shell"><div><p class="eyebrow"><span></span> Industries</p><h1>Sector context changes the buying journey, not the evidence standard.</h1><p>Industry routes help prospects find relevant problems and work faster without turning the site into six unrelated agencies.</p></div></section><section class="conversion-section section-shell"><div class="solution-grid">'''+cards+'''</div></section>'''
          (root/'industries.html').write_text(shell('Industries','Digital strategy and delivery by sector, including real estate, hospitality, beauty, professional services, B2B and retail.',ibody),encoding='utf-8')
          for slug,title,desc in industries[-2:]:
              body=f'''<section class="page-hero section-shell"><div><p class="eyebrow"><span></span> Industry / {title}</p><h1>Digital growth for {title} businesses that need clearer commercial systems.</h1><p>{desc}</p><div class="hero-actions"><a class="button button-primary" href="/start-project.html?industry={quote(title)}">Discuss your {title} project</a><a class="button button-ghost" href="/portfolio.html">View Work</a></div></div></section><section class="conversion-section section-shell"><div class="buying-grid"><article><span>Demand</span><h3>Find the right audience</h3><p>Prioritise qualified demand rather than vanity reach.</p></article><article><span>Conversion</span><h3>Make the buying path clear</h3><p>Message, proof and CTA structure reflect the decision customers need to make.</p></article><article><span>Follow-up</span><h3>Protect generated demand</h3><p>Lead or customer handoffs are visible instead of disappearing between tools.</p></article><article><span>Evidence</span><h3>Measure what matters</h3><p>Use commercial indicators that match the business model and available data.</p></article></div></section>'''
              (root/'industries'/(slug+'.html')).write_text(shell(title+' Digital Growth',desc,body),encoding='utf-8')

          # Legal pages.
          privacy='''<section class="page-hero section-shell"><div><p class="eyebrow"><span></span> Privacy</p><h1>Clear handling of enquiry and website data.</h1><p>This page explains the current static-site setup and the data used for analytics and direct contact.</p></div></section><section class="conversion-section section-shell"><div class="legal-grid"><aside class="legal-card"><h2>Summary</h2><p>The current project and call forms prepare messages in your browser. They do not store the submitted form content on this static website.</p></aside><article class="legal-card"><h2>Privacy notice</h2><h3>Analytics</h3><p>The site uses Google Tag Manager and may load analytics or marketing measurement configured through that container. Those tools may set cookies or collect device and interaction information subject to their configuration.</p><h3>Project enquiries</h3><p>When you choose WhatsApp or email, the information you entered is transferred through that service after you explicitly continue. The website itself does not currently retain the form content.</p><h3>Future backend capture</h3><p>If a server-side lead endpoint is connected later, this notice should be updated to identify the storage provider, retention period and lawful basis before that endpoint is enabled.</p><h3>Contact</h3><p>Privacy questions can be sent to james@jamesrealty.uk.</p></article></div></section>'''
          terms='''<section class="page-hero section-shell"><div><p class="eyebrow"><span></span> Terms</p><h1>Website and engagement terms at a practical level.</h1><p>These website terms are informational. Project-specific scope, fees, milestones, rights and responsibilities are defined in the written proposal or agreement for that engagement.</p></div></section><section class="conversion-section section-shell"><div class="legal-grid"><aside class="legal-card"><h2>Commercial rule</h2><p>No website page, case study or pricing starting point replaces a project-specific written scope.</p></aside><article class="legal-card"><h2>Website terms</h2><h3>Portfolio and results</h3><p>Public project links and case studies are presented with evidence notes. Company-wide outcomes are not automatically attributed to James Digital unless the page states the evidence basis.</p><h3>Pricing</h3><p>Published prices are starting points or typical ranges, not binding quotations. Third-party costs, media spend, software and specialist production may be separate.</p><h3>Availability</h3><p>Call times submitted through the website are requests until confirmed. Project timelines begin only after scope, access and commercial terms are agreed.</p><h3>Intellectual property</h3><p>Ownership, licences and handover terms are defined per engagement. Third-party trademarks and project assets remain the property of their respective owners.</p></article></div></section>'''
          (root/'privacy.html').write_text(shell('Privacy Policy','James Digital privacy and enquiry data handling information.',privacy),encoding='utf-8')
          (root/'terms.html').write_text(shell('Terms','James Digital website and engagement terms.',terms),encoding='utf-8')

          # Apply common changes to all HTML after generation.
          for p in root.rglob('*.html'):
              p.write_text(common(p.read_text(encoding='utf-8')),encoding='utf-8')

          # Sitemap: include every public HTML page except 404.
          urls=[]
          for p in sorted(root.rglob('*.html')):
              if p.name=='404.html': continue
              rel=p.relative_to(root).as_posix()
              loc='https://digital.jamesrealty.uk/' if rel=='index.html' else 'https://digital.jamesrealty.uk/'+rel
              pr='1.0' if rel=='index.html' else ('0.9' if rel in {'portfolio.html','start-project.html','book-call.html','results.html'} else '0.7')
              urls.append(f'<url><loc>{loc}</loc><changefreq>weekly</changefreq><priority>{pr}</priority></url>')
          (root/'sitemap.xml').write_text('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'+''.join(urls)+'</urlset>\n',encoding='utf-8')

          # Guard note for future generator runs.
          bp=root/'build-pages.mjs'
          if bp.exists():
              txt=bp.read_text(encoding='utf-8')
              marker='// Conversion guard: .github/workflows/apply-digital-conversion-rebuild.yml reapplies buyer-flow enhancements after digital changes.'
              if marker not in txt: txt=marker+'\n'+txt
              bp.write_text(txt,encoding='utf-8')
          PY
      - name: Validate rebuilt site
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path('digital')
          required=['index.html','portfolio.html','results.html','about.html','pricing.html','start-project.html','book-call.html','solutions.html','industries.html','privacy.html','terms.html','conversion-20260830.css','conversion-20260830.js']
          missing=[x for x in required if not (root/x).exists()]
          if missing: raise SystemExit('Missing: '+', '.join(missing))
          for p in root.rglob('*.html'):
              t=p.read_text(encoding='utf-8')
              if p.name!='404.html' and '/conversion-20260830.js' not in t: raise SystemExit('Missing conversion JS: '+str(p))
              if '/start-project.html?route=call' in t: raise SystemExit('Old fake call route remains: '+str(p))
          if '$199' in (root/'pricing.html').read_text() or '$499' in (root/'pricing.html').read_text(): raise SystemExit('Old low-cost pricing remains')
          print('Digital conversion rebuild validation passed')
          PY
      - name: Commit rebuilt Digital site
