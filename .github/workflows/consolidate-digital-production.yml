name: Consolidate Digital production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-digital-production.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate James Digital
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, json, html

          root = Path('digital')
          VERSION = '20260830-consolidated-1'
          BASE = 'https://digital.jamesrealty.uk'

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p, s):
              p = Path(p); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(s, encoding='utf-8')

          # ---- One production CSS source ----
          css_files = [
              root/'styles-base-feasibility-20260829.css',
              root/'gold-production-20260830.css',
              root/'styles-responsive-final-20260830.css',
              root/'typography-feasibility-20260830.css',
              root/'conversion-20260830.css',
          ]
          css = "@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Roboto+Flex:opsz,wdth,wght@8..144,75..150,300..800&display=swap');\n/* James Digital consolidated production CSS, 2026-08-30 */\n"
          for f in css_files:
              if f.exists():
                  part = read(f)
                  part = re.sub(r'^@import[^;]+;\s*', '', part, flags=re.M)
                  css += f"\n/* SOURCE: {f.name} */\n{part.strip()}\n"
          css += r'''
          /* Consolidated commercial-proof and form refinements */
          .brand-proof{padding:26px 0;border-block:1px solid var(--line);background:#0c0a08}
          .brand-proof .section-shell{display:grid;grid-template-columns:180px 1fr;gap:28px;align-items:center}
          .brand-proof p{margin:0;color:var(--muted);font-size:.75rem}
          .brand-list{display:flex;flex-wrap:wrap;gap:10px}
          .brand-list span{padding:9px 12px;border:1px solid var(--line);border-radius:999px;color:#e5d9c9;font-size:.76rem;font-weight:700}
          .metric-grid,.career-grid,.evidence-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
          .metric-card,.career-card,.evidence-card{padding:22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(213,170,82,.05),transparent 55%),var(--surface)}
          .metric-card strong{display:block;color:var(--accent-2);font-family:var(--font-display);font-stretch:135%;font-size:clamp(2rem,4vw,3.15rem);font-weight:520;line-height:1}
          .metric-card span,.career-card p,.evidence-card p{display:block;margin:9px 0 0;color:var(--muted);font-size:.82rem;line-height:1.6}
          .metric-card small{display:block;margin-top:8px;color:#817565;font-size:.68rem;line-height:1.5}
          .career-card h3,.evidence-card h3{margin:8px 0 0;font-size:1.08rem}
          .career-card>span,.evidence-card>span{color:var(--accent);font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em}
          .timeline-clean{display:grid;gap:0;border-top:1px solid var(--line)}
          .timeline-clean article{display:grid;grid-template-columns:190px 1fr;gap:28px;padding:28px 0;border-bottom:1px solid var(--line)}
          .timeline-clean time{color:var(--accent);font-size:.75rem;font-weight:800}
          .timeline-clean h3{margin:0 0 7px;font-size:1.25rem}.timeline-clean p{margin:0;color:var(--muted);font-size:.9rem}
          .form-status-box{grid-column:1/-1;padding:13px 14px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:.8rem;line-height:1.55}
          .form-status-box[data-state='success']{border-color:rgba(213,170,82,.45);color:#f0d083;background:rgba(213,170,82,.06)}
          .form-status-box[data-state='error']{border-color:rgba(255,120,120,.35);color:#ffc1c1;background:rgba(255,80,80,.05)}
          .honeypot{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;overflow:hidden!important}
          .proof-boundary{padding:20px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.018);color:var(--muted);font-size:.82rem;line-height:1.7}
          .role-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--line);margin:22px 0}
          .role-strip div{padding:18px;border-right:1px solid var(--line)}.role-strip div:last-child{border-right:0}
          .role-strip span{display:block;color:#867a6b;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em}.role-strip strong{display:block;margin-top:6px;font-size:.82rem;line-height:1.45}
          .single-cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
          .response-note{margin-top:12px;color:#8d8172;font-size:.74rem;line-height:1.5}
          .profile-shot{width:min(100%,390px);aspect-ratio:4/5;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
          @media(max-width:900px){.metric-grid,.career-grid,.evidence-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.brand-proof .section-shell{grid-template-columns:1fr}.timeline-clean article{grid-template-columns:1fr}.role-strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:620px){.metric-grid,.career-grid,.evidence-cards,.role-strip{grid-template-columns:1fr}.brand-proof{padding:22px 0}.brand-list span{font-size:.72rem}}
          '''
          write(root/'styles.css', css.strip()+"\n")

          legacy_css = [
              'styles-base-feasibility-20260829.css','gold-production-20260830.css','styles-responsive-final-20260830.css',
              'typography-feasibility-20260830.css','conversion-20260830.css','gold-theme-digital.css','mobile-viewport-fix.css',
              'styles-feasibility-purple-backup.css','styles-responsive-20260830.css'
          ]
          for name in legacy_css:
              p=root/name
              if p.exists(): p.unlink()

          # ---- One production JS source ----
          js = read(root/'script.js')
          marker = '  var form = document.getElementById("project-form");'
          if marker in js:
              js = js.split(marker)[0].rstrip() + '\n'
              if js.endswith('})();'):
                  js = js[:-5]
          else:
              js = js.rsplit('})();',1)[0]
          js += r'''
            function formObject(form){var out={};new FormData(form).forEach(function(v,k){if(!k.startsWith('_'))out[k]=String(v)});return out}
            function contextMeta(obj){var p=new URLSearchParams(location.search);obj.landing_page=location.pathname;obj.referrer=document.referrer||'';obj.utm_source=p.get('utm_source')||'';obj.utm_medium=p.get('utm_medium')||'';obj.utm_campaign=p.get('utm_campaign')||'';obj.consent=true;return obj}
            function setStatus(node,message,state){if(!node)return;node.textContent=message;node.dataset.state=state||''}
            async function submitJson(url,payload){var r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});var data={};try{data=await r.json()}catch(e){}if(!r.ok)throw new Error(data.error||'Request could not be saved');return data}

            var lead=document.getElementById('lead-form');
            if(lead){
              var next=lead.querySelector('[data-lead-next]'), step2=lead.querySelector('[data-step="2"]'), status=lead.querySelector('[data-form-status]');
              if(next)next.addEventListener('click',function(){var bad=Array.from(lead.querySelectorAll('[data-step="1"] [required]')).find(function(el){return !el.checkValidity()});if(bad){bad.reportValidity();return}step2.hidden=false;next.hidden=true;step2.scrollIntoView({behavior:reducedMotion?'auto':'smooth',block:'start'})});
              lead.addEventListener('submit',async function(e){e.preventDefault();if(!lead.checkValidity()){lead.reportValidity();return}var btn=lead.querySelector('[type="submit"]');btn.disabled=true;setStatus(status,'Saving your project enquiry securely…','');try{var data=await submitJson('/api/digital-lead',contextMeta(formObject(lead)));setStatus(status,'Enquiry received. Reference '+data.lead_id+'. Response target: within one business day.','success');track('digital_lead_captured',{lead_priority:data.priority||'',lead_score:data.lead_score||0});lead.reset();if(step2)step2.hidden=false}catch(err){setStatus(status,'The secure form could not save your enquiry. Please email james@jamesrealty.uk.','error');track('digital_lead_error',{error:String(err.message||err)})}finally{btn.disabled=false}});
            }
            var call=document.getElementById('call-form');
            if(call){
              var date=call.querySelector('#call-date'),zone=call.querySelector('#call-timezone'),statusCall=call.querySelector('[data-form-status]');
              if(zone)zone.value=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';if(date){var n=new Date();n.setHours(n.getHours()+2);date.min=n.toISOString().slice(0,16)}
              call.addEventListener('submit',async function(e){e.preventDefault();if(!call.checkValidity()){call.reportValidity();return}var btn=call.querySelector('[type="submit"]');btn.disabled=true;setStatus(statusCall,'Saving your call request…','');try{var payload=contextMeta(formObject(call)),data=await submitJson('/api/digital-call',payload);setStatus(statusCall,'Call request received. Reference '+data.lead_id+'. Your preferred time is provisional until confirmed.','success');var cal=call.querySelector('[data-call-calendar]');if(cal&&payload.preferred_time){var s=new Date(payload.preferred_time),en=new Date(s.getTime()+30*60000),stamp=function(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')};cal.href='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Provisional call with James Digital')+'&dates='+stamp(s)+'/'+stamp(en)+'&details='+encodeURIComponent('Provisional hold. James will confirm the call separately.')+'&ctz='+encodeURIComponent(payload.timezone||'UTC');cal.hidden=false}track('digital_call_requested')}catch(err){setStatus(statusCall,'The secure call request could not be saved. Please email james@jamesrealty.uk.','error')}finally{btn.disabled=false}});
            }
            if(!document.querySelector('.mobile-conversion-bar')&&!document.body.classList.contains('start-project-page')&&!document.body.classList.contains('request-call-page')){var bar=document.createElement('div');bar.className='mobile-conversion-bar';bar.innerHTML='<a href="/start-project">Start a Project</a><a href="/request-call">Request a Call</a>';document.body.appendChild(bar)}
          })();
          '''
          write(root/'script.js', js.strip()+"\n")
          p=root/'conversion-20260830.js'
          if p.exists(): p.unlink()

          # Stale generator was a second source of truth and could regenerate old pricing/copy.
          gen=root/'build-pages.mjs'
          if gen.exists(): gen.unlink()

          if Path('james-ravi-profile.jpg').exists():
              (root/'assets').mkdir(exist_ok=True)
              (root/'assets'/'james-ravi-profile.jpg').write_bytes(Path('james-ravi-profile.jpg').read_bytes())

          HEADER = '''<header class="site-header" id="top"><div class="nav-shell"><a class="brand" href="/" aria-label="James Digital home"><span class="brand-mark">JD</span><span>James Digital</span></a><nav class="nav-links" aria-label="Primary navigation"><a href="/portfolio">Work</a><a href="/solutions">Solutions</a><a href="/industries">Industries</a><a href="/results">Results</a><a href="/about">About</a></nav><div class="nav-actions"><a class="button button-small button-primary" href="/start-project" data-event="start_project_click">Start a Project</a></div><button class="menu-button" type="button" aria-expanded="false" aria-controls="mobile-nav"><span>Menu</span></button></div><nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation" hidden><a href="/portfolio">Work</a><a href="/solutions">Solutions</a><a href="/industries">Industries</a><a href="/results">Results</a><a href="/about">About</a><a href="/pricing">Pricing</a><a href="/request-call">Request a Call</a><a class="button button-primary" href="/start-project">Start a Project</a></nav></header>'''
          FOOTER = '''<footer class="site-footer"><div class="section-shell footer-grid"><div><a class="brand footer-brand" href="/"><span class="brand-mark">JD</span><span>James Digital</span></a><p>Dubai-based senior digital growth partner for high-consideration businesses, available globally.</p></div><nav aria-label="Explore"><strong>Explore</strong><a href="/portfolio">Work</a><a href="/solutions">Solutions</a><a href="/industries">Industries</a><a href="/results">Results</a><a href="/about">Meet James</a><a href="/pricing">Pricing</a></nav><nav aria-label="Contact"><strong>Contact</strong><a href="/start-project">Start a Project</a><a href="/request-call">Request a Call</a><a href="mailto:james@jamesrealty.uk?subject=Digital%20project%20enquiry">Email James</a><a href="https://wa.me/971528420933?text=Hi%20James%2C%20I%20would%20like%20to%20discuss%20a%20digital%20project." target="_blank" rel="noopener noreferrer">WhatsApp</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></nav><div class="footer-meta"><span>Dubai, United Arab Emirates</span><span>James Digital is the digital-services practice within the jamesrealty.uk domain infrastructure.</span><span>© <span data-year></span> James Digital</span></div></div></footer>'''

          def page(title, desc, path, body, body_class='content-page', schema=None):
              url = BASE + (path if path != '/' else '/')
              schema_html = '' if not schema else '<script type="application/ld+json">'+json.dumps(schema,separators=(',',':'))+'</script>'
              return f'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{html.escape(title)}</title><meta name="description" content="{html.escape(desc,quote=True)}"><meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"><link rel="canonical" href="{url}"><meta property="og:type" content="website"><meta property="og:site_name" content="James Digital"><meta property="og:title" content="{html.escape(title,quote=True)}"><meta property="og:description" content="{html.escape(desc,quote=True)}"><meta property="og:url" content="{url}"><meta name="twitter:card" content="summary"><meta name="theme-color" content="#0b0906"><meta name="last-modified" content="2026-08-30"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css?v={VERSION}">{schema_html}</head><body class="{body_class}"><a class="skip-link" href="#main">Skip to content</a>{HEADER}<main id="main">{body}</main>{FOOTER}<script src="/script.js?v={VERSION}" defer></script></body></html>'''

          home_body = '''<section class="hero section-shell"><div class="hero-copy"><p class="eyebrow"><span></span> Dubai-based. Available globally.</p><h1>Senior digital growth systems for <em>high-consideration businesses.</em></h1><p class="hero-lead">Work directly with James when the challenge spans qualified demand, conversion, CRM follow-up and measurement. Best suited to real estate, hospitality, premium consumer, B2B and professional-service businesses where every lead or sale matters.</p><div class="hero-actions"><a class="button button-primary" href="/start-project">Discuss Your Project</a><a class="button button-ghost" href="/portfolio">See Relevant Work</a></div><div class="hero-signals"><span><strong>10+ years</strong> marketing career</span><span><strong>AED 700K</strong> avg. monthly media budget handled</span><span><strong>50+ markets</strong> acquisition scope</span><span><strong>Direct senior access</strong> strategy to delivery</span></div></div><div class="system-map" aria-label="Digital growth operating model"><div class="system-map-top"><span>Growth operating model</span><span class="live-dot">Direct</span></div><div class="system-orbit"><span class="orbit-label orbit-dubai">Positioning<br><small>Demand</small></span><span class="orbit-label orbit-europe">Website<br><small>Conversion</small></span><span class="orbit-label orbit-asia">CRM<br><small>Follow-up</small></span><span class="orbit-label orbit-americas">Measurement<br><small>Improve</small></span><div class="orbit-core"><strong>Commercial<br>outcome</strong><span>One accountable owner</span></div></div><div class="system-flow"><span>Diagnose</span><i></i><span>Build</span><i></i><span>Measure</span><i></i><span>Improve</span></div></div></section><section class="brand-proof"><div class="section-shell"><p>Selected career, employer, co-brand and client-side experience. Relationship varies by brand.</p><div class="brand-list"><span>Nationwide</span><span>Binghatti</span><span>TBWA\\RAAD</span><span>Bugatti</span><span>Mercedes-Benz</span><span>Jacob &amp; Co</span><span>Nissan</span><span>Emirates</span></div></div></section><section class="conversion-section section-shell"><div class="section-heading"><div><p class="kicker">Measured career evidence</p><h2>Commercial proof, not just capability claims.</h2></div><p>Results are labelled by scope so company-wide outcomes, career evidence and individual project work are not blurred together.</p></div><div class="metric-grid"><article class="metric-card"><strong>750+</strong><span>Closed deals in documented property-business career scope</span><small>Not claimed as individually closed by James.</small></article><article class="metric-card"><strong>74.21%</strong><span>Open rate on strongest documented investor nurture send</span><small>45.85% click-through rate.</small></article><article class="metric-card"><strong>+11.5%</strong><span>Documented search-visibility growth</span><small>37.67% visibility, 36 Top-3 keywords.</small></article><article class="metric-card"><strong>+343%</strong><span>Documented organic video-view growth</span><small>102K+ organic views from a 23K baseline.</small></article></div><div class="hero-actions"><a class="button button-ghost" href="/results">Review Results & Evidence</a></div></section><section class="conversion-section fit-section" id="capabilities"><div class="section-shell"><div class="section-heading"><div><p class="kicker">Four connected systems</p><h2>Less channel sprawl. More commercial connection.</h2></div><p>The service model is intentionally grouped around business systems rather than pretending every channel is a separate product.</p></div><div class="why-grid"><article><span>01</span><h3>Strategy & positioning</h3><p>Offer, audience, journey, prioritisation and go-to-market direction.</p></article><article><span>02</span><h3>Demand generation</h3><p>Paid acquisition, SEO and content built around qualified demand.</p></article><article><span>03</span><h3>Conversion experience</h3><p>Websites and landing journeys designed to turn attention into action.</p></article><article><span>04</span><h3>CRM & measurement</h3><p>Lead routing, follow-up visibility, analytics and feedback loops.</p></article></div></div></section><section class="conversion-section section-shell"><div class="section-heading"><div><p class="kicker">Why work directly</p><h2>Senior ownership without a junior account layer.</h2></div></div><div class="reference-grid"><article><strong>References available for serious engagements</strong><p>Client quotations are not invented or published without permission. Public work, named career context and references during a qualified commercial conversation provide the validation layer.</p></article><article><strong>Clear delivery model</strong><p>James owns diagnosis, direction and client communication. Specialist production is identified when a scope needs additional hands.</p></article></div></section><section class="section final-cta"><div class="section-shell final-cta-inner"><p class="kicker">Next step</p><h2>Start with the business problem.</h2><div class="single-cta"><a class="button button-light" href="/start-project">Start a Project</a><a class="button button-outline-light" href="/request-call">Request a Call</a></div></div></section>'''
          schema={"@context":"https://schema.org","@type":"ProfessionalService","name":"James Digital","url":BASE+"/","description":"Dubai-based senior digital growth partner for high-consideration businesses.","areaServed":"Worldwide","founder":{"@type":"Person","name":"James Ravi","url":BASE+"/about"},"dateModified":"2026-08-30"}
          write(root/'index.html', page('James Digital | Senior Digital Growth Partner in Dubai','Senior digital strategy, acquisition, conversion, CRM and measurement for high-consideration businesses in Dubai and worldwide.','/',home_body,'home-page',schema))

          results_body='''<section class="page-hero section-shell"><div><p class="eyebrow"><span></span> Results & Evidence</p><h1>Measured outcomes with the scope made explicit.</h1><p>Career evidence, public project evidence and company-wide results are separated so the numbers remain useful without overstating individual attribution.</p><div class="hero-actions"><a class="button button-primary" href="/portfolio">Review Work</a><a class="button button-ghost" href="/start-project">Discuss a Similar Problem</a></div></div><aside class="service-outcome"><span>Evidence standard</span><p>Named results below come from the existing documented James Ravi career portfolio. Individual case studies identify their own contribution boundary.</p></aside></section><section class="conversion-section section-shell"><div class="metric-grid"><article class="metric-card"><strong>AED 700K</strong><span>Average monthly media budget handled</span><small>Career scope across documented property-business roles.</small></article><article class="metric-card"><strong>750+</strong><span>Closed deals in documented career scope</span><small>Commercial outcome across two property businesses, not individual sales authorship.</small></article><article class="metric-card"><strong>74.21%</strong><span>Investor nurture open rate</span><small>Strongest documented send, with 45.85% CTR.</small></article><article class="metric-card"><strong>102K+</strong><span>Organic video views</span><small>+343% growth from a 23K baseline.</small></article></div></section><section class="conversion-section fit-section"><div class="section-shell"><div class="section-heading"><div><p class="kicker">Search & acquisition evidence</p><h2>Performance is judged beyond the form fill.</h2></div></div><div class="evidence-cards"><article class="evidence-card"><span>SEO / 2026</span><h3>37.67% search visibility</h3><p>Documented improvement from 31.61%, with 36 Top-3 keywords and 83 Top-100 keywords.</p></article><article class="evidence-card"><span>CRM / 2025</span><h3>74.21% open, 45.85% CTR</h3><p>Segmented investor nurture using custom HTML, CRM logic, personalised copy and automated delivery.</p></article><article class="evidence-card"><span>Organic / 2025</span><h3>+343% view growth</h3><p>102K+ organic video views across a six-platform content and social-search system.</p></article><article class="evidence-card"><span>Career scope</span><h3>50+ international markets</h3><p>International investor and acquisition remit documented across senior real-estate marketing roles.</p></article></div><p class="proof-boundary">References can be requested during a qualified commercial conversation. Testimonials are not manufactured, and company-wide outcomes are not automatically assigned to a single project.</p></div></section><section class="section final-cta"><div class="section-shell final-cta-inner"><p class="kicker">Apply the evidence</p><h2>Need a cleaner route from demand to sale?</h2><div><a class="button button-light" href="/start-project">Start a Project</a></div></div></section>'''
          write(root/'results.html',page('Digital Marketing Results & Evidence | James Digital','Measured career evidence across acquisition, CRM, SEO and organic growth, with clear attribution boundaries.','/results',results_body))

          about_body='''<section class="page-hero section-shell"><div><p class="eyebrow"><span></span> Meet James</p><h1>Senior marketing leadership, brought directly into digital delivery.</h1><p>James Ravi is a Dubai-based marketing leader with more than a decade across real estate, luxury launches, agency growth, performance acquisition and CRM-led conversion. James Digital brings that experience into direct project and growth-partnership work.</p><div class="hero-actions"><a class="button button-primary" href="/start-project">Discuss Your Project</a><a class="button button-ghost" href="/results">See Results</a></div></div><img class="profile-shot" src="/assets/james-ravi-profile.jpg" alt="James Ravi in Dubai" width="1024" height="1536"></section><section class="conversion-section section-shell"><div class="metric-grid"><article class="metric-card"><strong>10+</strong><span>Years in marketing</span></article><article class="metric-card"><strong>AED 80B+</strong><span>Property portfolio supported in career scope</span></article><article class="metric-card"><strong>50+</strong><span>International markets</span></article><article class="metric-card"><strong>3</strong><span>Iconic branded launches in documented career scope</span></article></div></section><section class="conversion-section fit-section"><div class="section-shell"><div class="section-heading"><div><p class="kicker">Career timeline</p><h2>The experience now lives here, not on another website.</h2></div></div><div class="timeline-clean"><article><time>Aug 2024, Present</time><div><h3>Senior Marketing Consultant, Nationwide Middle East Properties</h3><p>Company-wide strategy spanning SEO, paid acquisition, property launches, CRM and lead nurture, investor collateral and team/vendor leadership.</p></div></article><article><time>May 2021, Aug 2024</time><div><h3>Marketing Director, Binghatti</h3><p>Global brand growth across an AED 80B+ property portfolio, including Bugatti Residences, Burj Binghatti Jacob 