name: Publish property news briefs

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/property-news-autopublish.yml'
      - '.automation/property-news-script/**'
      - 'scripts/upgrade_property_news_images.py'

permissions:
  contents: write

# All workflows that commit generated website files share this group. This prevents
# concurrent publishers/audits from rebasing and pushing the same generated files.
concurrency:
  group: site-content-writes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and configure publisher script
        shell: bash
        run: |
          mkdir -p scripts
          cat .automation/property-news-script/chunk-*.txt \
            | tr -d '\n' \
            | base64 -d \
            | gzip -d \
            > scripts/property_news_autopublish.py
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/property_news_autopublish.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('James' + ' Ravi', 'James')
          path.write_text(text, encoding='utf-8')
          PY
          chmod +x scripts/property_news_autopublish.py
          python -m py_compile scripts/property_news_autopublish.py
          python -m py_compile scripts/upgrade_property_news_images.py

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Check sources and publish briefs
        run: python scripts/property_news_autopublish.py

      - name: Upgrade automated brief imagery
        run: python scripts/upgrade_property_news_images.py

      - name: Commit published updates
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No new property articles or website updates."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-publish UAE property news briefs"
          # A shared concurrency group should make this uncommon, but rebase once
          # before pushing so a manual commit made during the run is preserved.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Notify search engines about published briefs
        if: steps.publish.outputs.changed == 'true'
        run: python scripts/submit_indexnow.py --diff HEAD^ HEAD || echo "IndexNow notification will be retried on the next website push."
