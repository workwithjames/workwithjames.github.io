name: Publish property news briefs

# Temporary ADREC request-module capture for dashboard verification.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/property-news-autopublish.yml'
      - '.automation/property-news-script/**'

permissions:
  contents: write

concurrency:
  group: property-news-autopublish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and configure publisher script
        shell: bash
        run: |
          mkdir -p scripts
          cat .automation/property-news-script/chunk-*.txt \
            | tr -d '\n' \
            | base64 -d \
            | gzip -d \
            > scripts/property_news_autopublish.py
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/property_news_autopublish.py')
          text = path.read_text(encoding='utf-8')
          start = text.find('NAV_HEADER =')
          end = text.find('FOOTER =', start)
          if start != -1 and end != -1:
              header = text[start:end].replace('James Ravi', 'James Realty')
              text = text[:start] + header + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          chmod +x scripts/property_news_autopublish.py
          python -m py_compile scripts/property_news_autopublish.py

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Capture ADREC public request modules
        shell: bash
        run: |
          mkdir -p .automation/adrec-modules
          curl --fail --location --silent --show-error \
            'https://adrec.gov.ae/adrec-assets/js/market-data/MarketDataGlobal.js' \
            -o .automation/adrec-modules/MarketDataGlobal.js
          curl --fail --location --silent --show-error \
            'https://adrec.gov.ae/adrec-assets/js/market-data/market-cards.js' \
            -o .automation/adrec-modules/market-cards.js
          curl --fail --location --silent --show-error \
            'https://adrec.gov.ae/adrec-assets/js/market-data/lease-cards.js' \
            -o .automation/adrec-modules/lease-cards.js
          curl --fail --location --silent --show-error \
            'https://adrec.gov.ae/adrec-assets/js/market-data/MarketDataTransactionScriptAPI.js' \
            -o .automation/adrec-modules/transactions.js
          curl --fail --location --silent --show-error \
            'https://adrec.gov.ae/adrec-assets/js/market-data/RecentSalesTable.js' \
            -o .automation/adrec-modules/recent-sales.js

      - name: Check sources and publish briefs
        run: python scripts/property_news_autopublish.py

      - name: Commit published updates
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No new property articles or website updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-publish UAE property news briefs"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
