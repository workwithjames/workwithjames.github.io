name: Publish property news briefs

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/property-news-autopublish.yml'
      - '.automation/property-news-script/**'
      - '.automation/replace-james-name'

permissions:
  contents: write

concurrency:
  group: property-news-autopublish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace personal name across website
        if: hashFiles('.automation/replace-james-name') != ''
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          root = Path('.')
          marker = Path('.automation/replace-james-name')
          target = 'James' + ' Ravi'
          replacement = 'James'
          chunk_dir = Path('.automation/property-news-script')
          chunks = sorted(chunk_dir.glob('chunk-*.txt'))
          chunk_paths = set(chunks)
          changed = []

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path in chunk_paths:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if target in text:
                  path.write_text(text.replace(target, replacement), encoding='utf-8')
                  changed.append(str(path))

          if chunks:
              encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
              script = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
              updated = script.replace(target, replacement)
              if updated != script:
                  packed = base64.b64encode(gzip.compress(updated.encode('utf-8'), mtime=0)).decode('ascii')
                  chunk_size = max(60000, max(len(path.read_text(encoding='utf-8').strip()) for path in chunks))
                  pieces = [packed[i:i + chunk_size] for i in range(0, len(packed), chunk_size)]
                  for index, piece in enumerate(pieces):
                      path = chunk_dir / f'chunk-{index:03d}.txt'
                      path.write_text(piece + '\n', encoding='utf-8')
                  for path in chunks[len(pieces):]:
                      path.unlink()
                  changed.append(str(chunk_dir))

          marker.unlink(missing_ok=True)
          print(f'Replaced personal name in {len(changed)} locations or templates.')
          PY

      - name: Restore and configure publisher script
        shell: bash
        run: |
          mkdir -p scripts
          cat .automation/property-news-script/chunk-*.txt \
            | tr -d '\n' \
            | base64 -d \
            | gzip -d \
            > scripts/property_news_autopublish.py
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/property_news_autopublish.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('James' + ' Ravi', 'James')
          path.write_text(text, encoding='utf-8')
          PY
          chmod +x scripts/property_news_autopublish.py
          python -m py_compile scripts/property_news_autopublish.py

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Check sources and publish briefs
        run: python scripts/property_news_autopublish.py

      - name: Commit published updates
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No new property articles or website updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace James Ravi with James across website"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
