name: Apply Nakheel premium refresh
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-nakheel-premium-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Refresh Nakheel landing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('landing/nakheel/index.html')
          s=p.read_text(encoding='utf-8')
          def sub(pattern,repl,label):
              global s
              s2,n=re.subn(pattern,repl,s,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              s=s2

          if 'nakheel-premium.css' not in s:
              s=s.replace('<link rel="stylesheet" href="https://jamesrealty.uk/assets/landing-experience.css?v=8">','<link rel="stylesheet" href="https://jamesrealty.uk/assets/landing-experience.css?v=8"><link rel="stylesheet" href="https://jamesrealty.uk/assets/nakheel-premium.css?v=1">')

          s=s.replace('<a href="#locations">Waterfront map</a><a href="#projects">Current collection</a><a href="#why-invest">Ownership lens</a><a href="#enquire">Enquire</a>','<a href="#overview">Destinations</a><a href="#projects">Current launches</a><a href="#locations">Coastline map</a><a href="#enquire">Private shortlist</a>')
          s=s.replace('>Request waterfront availability</a>','>Get current Nakheel shortlist</a>',1)

          hero='''<section class="jr-hero jr-hero--coastline" aria-labelledby="hero-title"><figure class="jr-hero__media"><img class="jr-hero__image" src="https://jamesrealty.uk/images/landing/nakheel-dubai-island-waterfront.webp" width="1600" height="900" alt="Aerial view of a premium Dubai island coastline representing Nakheel waterfront property" fetchpriority="high" decoding="async"><span class="jr-hero__wash"></span></figure><div class="jr-shell jr-hero__inner"><div class="jr-hero__copy" data-reveal><p class="jr-kicker">Independent Nakheel waterfront advisory</p><h1 class="jr-display" id="hero-title">Choose the island before the unit.</h1><p class="jr-hero__lead">Compare Nakheel’s current coastal opportunities across Palm Jebel Ali, Dubai Islands and Palm Jumeirah by destination maturity, exact orientation, delivery evidence and ownership cost.</p><div class="jr-actions"><a class="jr-button jr-button--light" data-cta="hero-primary" data-location="hero" href="#enquire">Get current Nakheel shortlist</a><a class="jr-text-link" data-cta="hero-secondary" data-location="hero" href="#projects">Explore current launches <span aria-hidden="true">↘</span></a></div><ul class="jr-hero__proof"><li>Official Nakheel sources</li><li>Coastline + view checks</li><li>Independent project comparison</li></ul><span class="nk-checked">Project facts checked 17 Aug 2026 · live inventory can change</span></div><p class="jr-hero__independent">Independent James Realty advisory — not Nakheel’s official website.</p></div></section>'''
          sub(r'<section class="jr-hero jr-hero--coastline".*?</section>',hero,'hero')

          facts='''<section class="jr-facts" aria-label="Nakheel at a glance"><div class="jr-shell jr-facts__track"><article><span>01</span><strong>Palm Central</strong><small>222-home June 2026 phase</small></article><article><span>02</span><strong>Bay Villas</strong><small>Dubai Islands · villa collection</small></article><article><span>03</span><strong>Bay Grove</strong><small>Final phase · Dubai Islands</small></article><article><span>04</span><strong>Como Residences</strong><small>76 residences · Palm Jumeirah</small></article></div></section>'''
          sub(r'<section class="jr-facts".*?</section>',facts,'facts')

          spectrum='''<section class="jr-section nk-spectrum" id="overview"><div class="jr-shell"><header class="jr-heading jr-heading--compact" data-reveal><p class="jr-kicker">Three coastal investment stories</p><h2 class="jr-display">The shoreline is not one market.</h2><p>Palm Jebel Ali, Dubai Islands and Palm Jumeirah sit at different stages of maturity. Compare infrastructure, access, future supply and buyer depth before comparing finishes.</p></header><div class="nk-spectrum-grid"><article class="nk-spectrum-card" data-reveal><span>01 · New island</span><h3>Palm Jebel Ali</h3><p>Active delivery, new infrastructure and a long-horizon coastal masterplan. Palm Central adds a lower-density apartment and townhouse route alongside villa-led fronds.</p><small>Best compared by phase + orientation</small></article><article class="nk-spectrum-card" data-reveal><span>02 · Emerging destination</span><h3>Dubai Islands</h3><p>Five connected islands with expanding beachfront, parks, hospitality and residential supply. Bay Villas and Bay Grove serve different household and investment profiles.</p><small>Best compared by island + project timing</small></article><article class="nk-spectrum-card" data-reveal><span>03 · Established premium</span><h3>Palm Jumeirah</h3><p>A mature global address with deeper operating and resale evidence. Newer ultra-prime products should be judged against established Palm pricing and service costs.</p><small>Best compared by scarcity + total cost</small></article></div></div></section>'''
          sub(r'<section class="jr-section jr-signature".*?</section>',spectrum,'spectrum')

          projects='''<section class="jr-section jr-project-section" id="projects"><div class="jr-shell"><header class="jr-heading" data-reveal><p class="jr-kicker">Current waterfront edit</p><h2 class="jr-display">Three Nakheel launches to compare now</h2><p>These are distinct propositions: a Palm Jebel Ali resort-residence release, villa-led Dubai Islands living, and the final Bay Grove residential phase. Availability must be confirmed at unit level.</p></header><div class="jr-projects"><article class="jr-project" data-reveal data-project-card="Palm Central Private Residences"><figure><img src="https://jamesrealty.uk/images/projects/nakheel-lagoon-residences.webp" width="724" height="543" loading="lazy" decoding="async" alt="Representative low-rise waterfront residences around a protected Dubai island lagoon"><figcaption>James Realty advisory visual — not an official project render</figcaption></figure><div class="jr-project__body"><span class="jr-project__meta">Palm Jebel Ali · Apartments + townhouses</span><h3>Palm Central</h3><p>Nakheel’s June 2026 phase released 222 beachfront residences across three low- to mid-rise buildings, with one- to four-bedroom apartments and four- to five-bedroom townhouses.</p><ul><li>222 homes in the latest phase</li><li>Direct beach access</li><li>1–4 BR apartments · 4–5 BR townhouses</li></ul><div class="jr-project__bottom"><span><strong>Request current release</strong><small>Live inventory must be reconfirmed</small></span><a class="jr-project__source" data-source-link href="https://www.nakheel.com/en/new-launches/palm-central-private-residences" target="_blank" rel="noopener noreferrer">Official source ↗</a></div><a class="jr-project__cta" href="#enquire" data-project-select="Palm Central Private Residences">Get current units <span aria-hidden="true">→</span></a></div></article><article class="jr-project" data-reveal data-project-card="Bay Villas Dubai Islands"><figure><img src="https://jamesrealty.uk/images/projects/nakheel-private-island-villas.webp" width="724" height="543" loading="lazy" decoding="async" alt="Representative waterfront villa community with private gardens and beaches in Dubai"><figcaption>James Realty advisory visual — not an official project render</figcaption></figure><div class="jr-project__body"><span class="jr-project__meta">Dubai Islands · Villas + townhouses</span><h3>Bay Villas</h3><p>Island B’s gated residential collection spans waterfront villas, garden villas, semi-detached residences and townhouses around parks and beach access.</p><ul><li>Five residential typologies</li><li>Private gardens + community parks</li><li>Exact release and construction status must be checked</li></ul><div class="jr-project__bottom"><span><strong>Request live availability</strong><small>Confirm type, plot and release</small></span><a class="jr-project__source" data-source-link href="https://www.nakheel.com/en/construction-progress/bay-villas-dubai-islands" target="_blank" rel="noopener noreferrer">Official source ↗</a></div><a class="jr-project__cta" href="#enquire" data-project-select="Bay Villas Dubai Islands">Get current units <span aria-hidden="true">→</span></a></div></article><article class="jr-project" data-reveal data-project-card="Bay Grove Residences"><figure><img src="https://jamesrealty.uk/images/projects/nakheel-beachfront-tower.webp" width="724" height="543" loading="lazy" decoding="async" alt="Representative premium beachfront residential building on Dubai Islands"><figcaption>James Realty advisory visual — not an official project render</figcaption></figure><div class="jr-project__body"><span class="jr-project__meta">Dubai Islands · Final residential phase</span><h3>Bay Grove</h3><p>Nakheel’s final Bay Grove phase on Island B introduced 257 residences across four buildings, including one- to four-bedroom apartments and a one-of-a-kind penthouse.</p><ul><li>257 homes in the final phase</li><li>1–4 BR apartments + penthouse</li><li>Previous releases had sold out</li></ul><div class="jr-project__bottom"><span><strong>Request current release</strong><small>Do not assume remaining inventory</small></span><a class="jr-project__source" data-source-link href="https://www.nakheel.com/en/media-centre/press-releases/news-detail/2025/07/03/nakheel-unveils-final-phase-of-bay-grove-residences-on-dubai-islands" target="_blank" rel="noopener noreferrer">Official source ↗</a></div><a class="jr-project__cta" href="#enquire" data-project-select="Bay Grove Residences">Get current units <span aria-hidden="true">→</span></a></div></article></div></div></section>'''
          sub(r'<section class="jr-section jr-project-section" id="projects">.*?</section>',projects,'projects')

          current='''<section class="jr-section nk-current" id="established"><div class="jr-shell"><header class="jr-heading" data-reveal><p class="jr-kicker">Established-Palm alternatives</p><h2 class="jr-display">Scarcity needs a different test.</h2><p>On and around Palm Jumeirah, compare scarcity, usable area, recurring charges and resale evidence rather than applying the same assumptions used for a new island masterplan.</p></header><div class="nk-current-grid"><article class="nk-current-card" data-reveal><span>Palm Jumeirah · Ultra-prime tower</span><h3>Como Residences</h3><p>76 storeys and only 76 residences, with two- to seven-bedroom homes and broad 180°–360° views. Treat the low residence count and amenity intensity as part of the ownership-cost analysis.</p><a href="https://www.nakheel.com/en/new-launches/como-residences" target="_blank" rel="noopener noreferrer">Official Nakheel page ↗</a></article><article class="nk-current-card" data-reveal><span>Palm Jumeirah gateway · Limited release</span><h3>Palm Beach Towers Podium Villas</h3><p>Nakheel’s May 2026 release comprised only 16 two-, three- and four-bedroom beachfront homes, with handover expected in H1 2027. Availability should never be assumed from the launch announcement.</p><a href="https://www.nakheel.com/en/media-centre/press-releases/news-detail/2026/05/19/nakheel-introduces-a-limited-collection-of-beachfront-homes-at-palm-beach-towers" target="_blank" rel="noopener noreferrer">Official Nakheel release ↗</a></article></div></div></section>'''
          s=s.replace('<section class="jr-section jr-lens-section" id="why-invest">',current+'<section class="jr-section jr-lens-section" id="why-invest">',1)

          # Update map copy and viewport to show the broader Dubai coast.
          s=s.replace('Dubai’s island investment spectrum','Three waterfront destinations, one Dubai coastline')
          s=s.replace('Palm Jumeirah offers established transaction and rental evidence; Palm Jebel Ali and Dubai Islands involve different delivery and growth assumptions.','Use the map for orientation only. Then compare the exact project, island phase, road access, future plots and view corridor.')
          s=s.replace('src="https://www.openstreetmap.org/export/embed.html?bbox=54.82%2C24.90%2C55.23%2C25.18&layer=mapnik&marker=25.0134%2C54.9870"','src="https://www.openstreetmap.org/export/embed.html?bbox=54.80%2C24.88%2C55.40%2C25.36&layer=mapnik&marker=25.0134%2C54.9870"')
          s=s.replace('https://www.openstreetmap.org/?mlat=25.0134&mlon=54.9870#map=12/25.0134/54.9870','https://www.openstreetmap.org/?mlat=25.0134&mlon=54.9870#map=10/25.12/55.10')

          # Refresh structured project list and FAQ wording without inventing availability.
          s=s.replace('"name":"Three points on the Nakheel waterfront map"','"name":"Current Nakheel waterfront opportunities compared"')
          s=s.replace('"name":"Palm Central"','"name":"Palm Central Private Residences"')
          s=s.replace('"name":"Palm Jebel Ali Villas"','"name":"Bay Villas Dubai Islands"')
          s=s.replace('"name":"Palm Beach Towers"','"name":"Bay Grove Residences"')
          s=s.replace('Nakheel announced another Palm Central phase in June 2026 and a limited Palm Beach Towers collection in May 2026.','Nakheel’s current launch pages feature Palm Central Private Residences, Bay Villas and Bay Grove Residences among its waterfront portfolio; exact availability is checked when you enquire.')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit Nakheel refresh
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add landing/nakheel/index.html
          git commit -m 'Refresh Nakheel landing design and waterfront project information'
          git push origin HEAD:main
