name: Site Quality Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'functions/**'
      - 'scripts/**'
      - 'data/**'
      - 'sitemap.xml'
      - 'feed.xml'
      - 'image-sitemap.xml'
      - 'robots.txt'
      - 'site.webmanifest'
      - '.github/workflows/site-quality-audit.yml'

permissions:
  contents: write

# Audit runs supersede older audits, but do not share the publisher queue. The
# report-only commit rebases before push, so it can safely coexist with publishing.
concurrency:
  group: site-quality-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit tools
        run: npm install --no-save --no-package-lock playwright@1.54.2 axe-core@4.10.3 wrangler@4.27.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets functions scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Validate backend scripts and structured files
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts
          python - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path('.')
          for file in list((root / 'data').glob('*.json')) + [root / 'site.webmanifest']:
              if file.exists():
                  with file.open(encoding='utf-8') as handle:
                      json.load(handle)
                  print(f'Valid JSON: {file}')

          for name in ('sitemap.xml', 'feed.xml', 'image-sitemap.xml'):
              file = root / name
              if file.exists():
                  ET.parse(file)
                  print(f'Valid XML: {file}')
          PY

      - name: Audit Google Tag Manager coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib

          root = pathlib.Path('.')
          container_id = 'GTM-M74SL57L'
          excluded = {
              '404.html',
              '_not-found.html',
              'digital/404.html',
          }
          html_files = sorted(
              path for path in root.rglob('*.html')
              if '.git' not in path.parts
              and '_next' not in path.parts
              and path.as_posix() not in excluded
          )
          missing = []
          for path in html_files:
              source = path.read_text(encoding='utf-8', errors='replace')
              if container_id not in source:
                  missing.append(path.as_posix())

          tagged = len(html_files) - len(missing)
          report = {
              'containerId': container_id,
              'htmlFilesChecked': len(html_files),
              'taggedFiles': tagged,
              'missingFiles': missing,
              'excludedTechnicalFiles': sorted(excluded),
          }
          (root / 'audit').mkdir(exist_ok=True)
          (root / 'audit' / 'google-tag-audit.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          print(f'Google Tag Manager {container_id}: {tagged}/{len(html_files)} user-facing HTML files tagged')
          if missing:
              print('Missing Google Tag Manager:')
              for path in missing:
                  print(f' - {path}')
          PY

      - name: Start Cloudflare Pages locally
        shell: bash
        run: |
          npx wrangler pages dev . --port 8788 --compatibility-date=2026-08-01 > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for attempt in {1..45}; do
            if curl --silent --fail http://127.0.0.1:8788/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wrangler.log
          exit 1

      - name: Verify permanent redirects
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8788/home/)" = "301"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8788/dubai-transactions/)" = "301"
          test "$(curl -sS -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8788/dubai-transactions/)" = "https://jamesrealty.uk/dubai-data/"

      - name: Run rendered site audit
        env:
          AUDIT_BASE_URL: http://127.0.0.1:8788
        run: node scripts/site_quality_audit.mjs

      - name: Show Wrangler log on failure
        if: failure()
        run: cat /tmp/wrangler.log || true

      - name: Commit audit reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/site-audit-report.json audit/google-tag-audit.json
          if git diff --cached --quiet; then
            echo 'Audit reports unchanged.'
          else
            git commit -m 'Update automated site quality reports'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Enforce error-free audits
        run: |
          node -e "const report=require('./audit/site-audit-report.json'); if(report.summary.errors){console.error('Site audit errors:',report.summary.errors); process.exit(1)} console.log('Site audit passed with no errors.')"
          node -e "const report=require('./audit/google-tag-audit.json'); if(report.missingFiles.length){console.error('Pages missing Google Tag Manager:',report.missingFiles); process.exit(1)} console.log('Google Tag Manager coverage passed:',report.taggedFiles+'/'+report.htmlFilesChecked)"
