# Consolidated live verification for digital.jamesrealty.uk.
name: Verify Digital live production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-digital-live-gold.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify custom-domain production flow
        shell: bash
        run: |
          set -euo pipefail
          base='https://digital.jamesrealty.uk'
          work="${RUNNER_TEMP}/digital-live"
          mkdir -p "$work"

          fetch_until() {
            local url="$1" out="$2" expected="$3" code=''
            for attempt in {1..12}; do
              code="$(curl -sS -L --connect-timeout 10 --max-time 30 -o "$out" -w '%{http_code}' "$url" || true)"
              if [[ "$code" == "$expected" ]]; then return 0; fi
              sleep 5
            done
            echo "Expected $expected from $url, got $code" >&2
            return 1
          }

          fetch_until "$base/" "$work/home.html" 200
          fetch_until "$base/pricing" "$work/pricing.html" 200
          fetch_until "$base/request-call" "$work/request-call.html" 200
          fetch_until "$base/styles.css?v=20260830-consolidated-1" "$work/styles.css" 200
          fetch_until "$base/script.js?v=20260830-consolidated-1" "$work/script.js" 200
          fetch_until "$base/sitemap.xml" "$work/sitemap.xml" 200

          grep -q 'high-consideration businesses' "$work/home.html"
          grep -q 'AED 700K' "$work/home.html"
          grep -q 'from \$5K' "$work/pricing.html"
          grep -q 'Request a Call' "$work/request-call.html"
          grep -q '/api/digital-lead' "$work/script.js"
          ! grep -q "@import url('styles-\|@import url('gold-" "$work/styles.css"
          ! grep -q '\.html</loc>' "$work/sitemap.xml"
          ! grep -q 'book-call' "$work/sitemap.xml"

          old_pricing_headers="$(curl -sS -I --connect-timeout 10 --max-time 30 "$base/pricing.html")"
          echo "$old_pricing_headers" | head -n1 | grep -Eq ' 301 | 302 | 307 | 308 '
          echo "$old_pricing_headers" | tr -d '\r' | grep -qi '^location: https://digital.jamesrealty.uk/pricing$'

          old_call_headers="$(curl -sS -I --connect-timeout 10 --max-time 30 "$base/book-call")"
          echo "$old_call_headers" | head -n1 | grep -Eq ' 301 | 302 | 307 | 308 '
          echo "$old_call_headers" | tr -d '\r' | grep -qi '^location: https://digital.jamesrealty.uk/request-call$'

          api_get="$(curl -sS --connect-timeout 10 --max-time 30 -o "$work/api-get.json" -w '%{http_code}' "$base/api/digital-lead")"
          [[ "$api_get" == '405' ]]
          grep -q 'Method not allowed' "$work/api-get.json"

          api_post="$(curl -sS --connect-timeout 10 --max-time 30 -o "$work/api-post.json" -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"honeypot":"qa-verification"}' "$base/api/digital-lead")"
          [[ "$api_post" == '202' ]]
          grep -q '"lead_id":"accepted"' "$work/api-post.json"

          {
            echo '## James Digital production verification'
            echo '- Homepage: 200, new positioning and evidence present'
            echo '- Pricing: clean URL 200, premium pricing present'
            echo '- Legacy .html pricing: redirects to clean URL'
            echo '- Request a Call: 200; legacy Book a Call redirects'
            echo '- CSS: single consolidated production source'
            echo '- JS: secure lead endpoint wired'
            echo '- API: GET protected; safe honeypot POST accepted without storage'
            echo '- Sitemap: extensionless URLs only'
          } >> "$GITHUB_STEP_SUMMARY"
