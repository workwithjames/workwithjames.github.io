name: Verify Aldar premium landing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-aldar-premium.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install browser driver
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24 >/dev/null 2>&1
          which google-chrome || which chromium || which chromium-browser
      - name: Verify live Aldar layout and content
        shell: bash
        run: |
          cat > aldar-qa.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import { execSync } from 'node:child_process';
          const chrome=execSync('which google-chrome || which chromium || which chromium-browser').toString().trim();
          const browser=await puppeteer.launch({headless:true,executablePath:chrome,args:['--no-sandbox']});
          const page=await browser.newPage();
          await page.setViewport({width:1440,height:1000,deviceScaleFactor:1});
          let data;
          for(let i=0;i<14;i++){
            await page.goto(`https://aldar.jamesrealty.uk/?aldarqa=${Date.now()}-${i}`,{waitUntil:'networkidle2',timeout:45000});
            data=await page.evaluate(()=>{
              const hs=s=>[...document.querySelectorAll(s)].map(e=>Math.round(e.getBoundingClientRect().height));
              const styles=[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>x.href);
              return {
                premiumCss:styles.some(h=>h.includes('aldar-premium.css?v=1')),
                title:document.querySelector('h1')?.textContent?.trim()||'',
                bodyText:document.body.innerText,
                overflow:document.documentElement.scrollWidth-window.innerWidth,
                pathway:hs('.aldar-pathway-card'),
                destinationIntro:hs('.aldar-destination-intro'),
                more:hs('.aldar-more-card'),
                process:hs('.jr-process__rail li'),
                map:hs('.aldar-map-wrap iframe')
              };
            });
            if(data.premiumCss && data.title.includes('Aldar, compared by destination')) break;
            await new Promise(r=>setTimeout(r,15000));
          }
          const max=a=>a.length?Math.max(...a):0;
          const desktop={
            premiumCss:data.premiumCss,
            currentHero:data.title.includes('Aldar, compared by destination'),
            currentProjects:data.bodyText.includes('Five current Aldar opportunities')&&data.bodyText.includes('Yas Park Place')&&data.bodyText.includes('Al Ghadeer Gardens'),
            currentFacts:data.bodyText.includes('80%')&&data.bodyText.includes('From AED 2m'),
            overflow:data.overflow<=2,
            pathway:max(data.pathway)<=310,
            destination:max(data.destinationIntro)<=520,
            more:max(data.more)<=310,
            process:max(data.process)<=190,
            map:max(data.map)<=350
          };
          await page.setViewport({width:390,height:844,deviceScaleFactor:1});
          await page.reload({waitUntil:'networkidle2',timeout:45000});
          const mobile=await page.evaluate(()=>({
            overflow:document.documentElement.scrollWidth-window.innerWidth,
            premiumCss:[...document.querySelectorAll('link[rel="stylesheet"]')].some(x=>x.href.includes('aldar-premium.css?v=1')),
            title:document.querySelector('h1')?.textContent?.trim()||''
          }));
          const checks={...desktop,mobileOverflow:mobile.overflow<=2,mobileCss:mobile.premiumCss,mobileHero:mobile.title.includes('Aldar, compared by destination')};
          console.log('ALDAR_PREMIUM_QA|'+JSON.stringify({checks,desktop:data,mobile}));
          await browser.close();
          if(!Object.values(checks).every(Boolean)) process.exit(1);
          JS
          node aldar-qa.mjs
