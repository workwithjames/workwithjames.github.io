name: Verify UK landing with native Chrome
on:
  push:
    paths:
      - '.github/workflows/verify-uk-live-native.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify public HTML is refreshed
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            html=$(curl -fsSL --max-time 25 "https://dubai.jamesrealty.uk/?native=$RANDOM-$i" || true)
            if printf '%s' "$html" | grep -q 'underwritten in pounds' && printf '%s' "$html" | grep -q 'uk-premium.css?v=1'; then
              printf '%s' "$html" > /tmp/uk-live.html
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
          grep -q 'Binghatti Skyflame' /tmp/uk-live.html
          grep -q 'Creek Bay' /tmp/uk-live.html
          ! grep -q 'The Canopies' /tmp/uk-live.html
          grep -q '2% buyer' /tmp/uk-live.html
          grep -q '2% seller' /tmp/uk-live.html
      - name: Measure live render with native Chrome
        shell: bash
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/tmp/version.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat > /tmp/uk-native.mjs <<'JS'
          import fs from 'node:fs';
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const base='http://127.0.0.1:9222';
          async function newPage(url){
            const res=await fetch(base+'/json/new?'+encodeURIComponent(url),{method:'PUT'});
            if(!res.ok) throw new Error('new page '+res.status);
            return res.json();
          }
          async function evaluate(wsUrl,expression){
            const ws=new WebSocket(wsUrl);
            await new Promise((resolve,reject)=>{ws.addEventListener('open',resolve,{once:true});ws.addEventListener('error',reject,{once:true});});
            let id=1;
            const send=(method,params={})=>new Promise((resolve,reject)=>{
              const msgId=id++;
              const handler=e=>{const m=JSON.parse(e.data);if(m.id===msgId){ws.removeEventListener('message',handler);m.error?reject(new Error(JSON.stringify(m.error))):resolve(m.result);}};
              ws.addEventListener('message',handler);
              ws.send(JSON.stringify({id:msgId,method,params}));
            });
            await send('Runtime.enable');
            await send('Page.enable');
            await wait(2200);
            const result=await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});
            ws.close();
            return result.result.value;
          }
          async function read(width,height){
            const target=await newPage('https://dubai.jamesrealty.uk/?native-render='+Date.now());
            const ws=new WebSocket(target.webSocketDebuggerUrl);
            await new Promise((resolve,reject)=>{ws.addEventListener('open',resolve,{once:true});ws.addEventListener('error',reject,{once:true});});
            let id=1;
            const send=(method,params={})=>new Promise((resolve,reject)=>{
              const msgId=id++;
              const handler=e=>{const m=JSON.parse(e.data);if(m.id===msgId){ws.removeEventListener('message',handler);m.error?reject(new Error(JSON.stringify(m.error))):resolve(m.result);}};
              ws.addEventListener('message',handler);
              ws.send(JSON.stringify({id:msgId,method,params}));
            });
            await send('Runtime.enable'); await send('Page.enable');
            await send('Emulation.setDeviceMetricsOverride',{width,height,deviceScaleFactor:1,mobile:false});
            await send('Page.navigate',{url:'https://dubai.jamesrealty.uk/?native-render='+Date.now()});
            await wait(3000);
            const expression=`(()=>{const h=s=>[...document.querySelectorAll(s)].map(e=>Math.round(e.getBoundingClientRect().height));return {title:document.querySelector('h1')?.textContent?.trim()||'',overflow:document.documentElement.scrollWidth-window.innerWidth,hero:h('.jr-hero'),facts:h('.jr-facts article'),tool:h('.jr-tool form'),projectBodies:h('.jr-project__body'),routes:h('.uk-route-grid article'),costs:h('.uk-cost-grid article'),locations:h('.uk-location-grid article'),lens:h('.jr-lens__grid article'),process:h('.jr-process__rail li'),form:h('.jr-form'),iframes:document.querySelectorAll('iframe').length,text:document.body.innerText};})()`;
            const r=await send('Runtime.evaluate',{expression,returnByValue:true});
            ws.close();
            return r.result.value;
          }
          const desktop=await read(1440,1000);
          const mobile=await read(390,844);
          const max=a=>a?.length?Math.max(...a):0;
          const checks={
            hero:desktop.title.includes('underwritten in pounds'),
            projects:desktop.text.includes('Binghatti Skyflame')&&desktop.text.includes('Golf Vale')&&desktop.text.includes('Creek Bay'),
            noCanopies:!desktop.text.includes('The Canopies'),
            noMap:desktop.iframes===0,
            desktopOverflow:desktop.overflow<=2,
            mobileOverflow:mobile.overflow<=2,
            heroHeight:max(desktop.hero)<=850,
            facts:max(desktop.facts)<=125,
            tool:max(desktop.tool)<=530,
            projectBodies:max(desktop.projectBodies)<=520,
            routes:max(desktop.routes)<=280,
            costs:max(desktop.costs)<=260,
            locations:max(desktop.locations)<=250,
            lens:max(desktop.lens)<=170,
            process:max(desktop.process)<=190,
            mobileProjects:max(mobile.projectBodies)<=720
          };
          const report={checked_at:new Date().toISOString(),pass:Object.values(checks).every(Boolean),checks,desktop,mobile};
          console.log(JSON.stringify(report,null,2));
          fs.mkdirSync('.github/qa',{recursive:true});
          fs.writeFileSync('.github/qa/uk-premium-native.json',JSON.stringify(report,null,2)+'\n');
          if(!report.pass) process.exit(1);
          JS
          node /tmp/uk-native.mjs
      - name: Save native QA report
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f .github/qa/uk-premium-native.json ]; then
            git add .github/qa/uk-premium-native.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record native Chrome QA for UK landing'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
