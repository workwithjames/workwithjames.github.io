name: Migrate site to jamesrealty.uk

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/migrate-jamesrealty-domain.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate domain and header branding
        run: python scripts/migrate_jamesrealty_domain.py

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate website to jamesrealty.uk"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
