name: Verify DAMAC final landing
on:
  push:
    paths:
      - '.github/workflows/verify-damac-final.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install browser driver
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24 >/dev/null 2>&1
      - name: Verify final public DAMAC render
        shell: bash
        run: |
          cat > damac-final.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import {execSync} from 'node:child_process';
          const chrome=execSync('which google-chrome || which chromium || which chromium-browser').toString().trim();
          const browser=await puppeteer.launch({headless:true,executablePath:chrome,args:['--no-sandbox']});
          const page=await browser.newPage();
          const read=async(width,height)=>{
            await page.setViewport({width,height,deviceScaleFactor:1});
            let d;
            for(let i=0;i<24;i++){
              await page.goto(`https://damac.jamesrealty.uk/?final=${Date.now()}-${i}`,{waitUntil:'networkidle2',timeout:45000});
              d=await page.evaluate(()=>{
                const h=s=>[...document.querySelectorAll(s)].map(e=>Math.round(e.getBoundingClientRect().height));
                const css=[...document.querySelectorAll('link[rel="stylesheet"]')].map(e=>e.href);
                return {
                  premium:css.some(x=>x.includes('damac-premium.css?v=1')),
                  finalCss:css.some(x=>x.includes('damac-spacing-final.css?v=1')),
                  title:document.querySelector('h1')?.textContent?.trim()||'',
                  text:document.body.innerText,
                  overflow:document.documentElement.scrollWidth-window.innerWidth,
                  projectBodies:h('.jr-project__body'),
                  projects:h('.jr-project'),
                  locations:h('.damac-location-grid article'),
                  current:h('.damac-current-grid'),
                  notes:h('.damac-current-notes article'),
                  lens:h('.jr-lens__grid article'),
                  process:h('.jr-process__rail li'),
                  maps:document.querySelectorAll('.jr-map-section, iframe').length
                };
              });
              if(d.premium && d.finalCss && d.title.includes('Luxury should hold up') && d.text.includes('Four addresses. Four different buyer pools.')) return d;
              await new Promise(r=>setTimeout(r,15000));
            }
            return d;
          };
          const desktop=await read(1440,1000);
          const mobile=await read(390,844);
          const max=a=>a?.length?Math.max(...a):0;
          const supporting=a=>a?.slice(1)||[];
          const checks={
            css:desktop.premium&&desktop.finalCss&&mobile.premium&&mobile.finalCss,
            hero:desktop.title.includes('Luxury should hold up'),
            facts:desktop.text.includes('Chelsea Residences')&&desktop.text.includes('DAMAC Islands 2')&&desktop.text.includes('Riverside Views')&&desktop.text.includes('Safa Gate'),
            locations:desktop.text.includes('Dubai Maritime City')&&desktop.text.includes('Dubailand')&&desktop.text.includes('Dubai Investment Park')&&desktop.text.includes('Sheikh Zayed Road'),
            noBulkyMap:desktop.maps===0,
            desktopOverflow:desktop.overflow<=2,
            mobileOverflow:mobile.overflow<=2,
            featureBody:(desktop.projectBodies[0]||0)<=470,
            supportingBodies:max(supporting(desktop.projectBodies))<=500,
            locationCards:max(desktop.locations)<=220,
            current:max(desktop.current)<=500,
            notes:max(desktop.notes)<=220,
            lens:max(desktop.lens)<=150,
            process:max(desktop.process)<=180
          };
          console.log('DAMAC_FINAL_QA|'+JSON.stringify({checks,desktop,mobile}));
          await browser.close();
          if(!Object.values(checks).every(Boolean)) process.exit(1);
          JS
          node damac-final.mjs
