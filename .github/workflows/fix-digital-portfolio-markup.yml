name: Fix Digital portfolio contribution markup

on:
  push:
    paths:
      - '.github/workflows/fix-digital-portfolio-markup.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed contribution markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('digital/portfolio.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('</p></h3>\n      <p>', '</p>\n      <p>')
          text = text.replace('</p></h3><p>', '</p><p>')
          if '</p></h3>' in text:
              raise SystemExit('Unexpected malformed closing h3 remains')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          grep -q 'contribution-note' digital/portfolio.html
          ! grep -q '</p></h3>' digital/portfolio.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digital/portfolio.html
          git commit -m 'fix(digital): repair portfolio contribution markup'
          git push
