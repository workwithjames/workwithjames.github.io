name: Apply Mudon premium refresh
on:
  push:
    paths:
      - '.github/workflows/apply-mudon-premium-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Refresh Mudon landing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('landing/mudon/index.html')
          html=path.read_text(encoding='utf-8')
          def sub(pattern,repl,label):
              global html
              html2,n=re.subn(pattern,repl,html,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              html=html2

          html=html.replace('<title>Mudon Dubai Villas &amp; Townhouses | Community Guide</title>','<title>Mudon Dubai Homes | Independent Phase &amp; Resale Guide</title>')
          old='Compare Mudon villas, townhouses and apartments by phase, family lifestyle, live availability and verified community evidence.'
          new='Compare Mudon townhouses and apartments by neighbourhood, phase, construction status and current resale or assignment availability with independent James Realty guidance.'
          html=html.replace(old,new)
          html=html.replace('Mudon Dubai Villas &amp; Townhouses | Community Guide','Mudon Dubai Homes | Independent Phase &amp; Resale Guide')
          if 'mudon-premium.css' not in html:
              html=html.replace('<link rel="stylesheet" href="https://jamesrealty.uk/assets/landing-experience.css?v=8">','<link rel="stylesheet" href="https://jamesrealty.uk/assets/landing-experience.css?v=8"><link rel="stylesheet" href="https://jamesrealty.uk/assets/mudon-premium.css?v=1">')

          hero='''<section class="jr-hero jr-hero--residential" aria-labelledby="hero-title"><figure class="jr-hero__media"><img class="jr-hero__image" src="https://jamesrealty.uk/images/landing/mudon-family-townhouses-dubai.webp" width="1600" height="900" alt="Landscaped walking path beside modern family townhouses representing Mudon Dubai community living" fetchpriority="high" decoding="async"><span class="jr-hero__wash"></span></figure><div class="jr-shell jr-hero__inner"><div class="jr-hero__copy" data-reveal><p class="jr-kicker">Independent Mudon property advisory</p><h1 class="jr-display" id="hero-title">Mudon is a street-by-street decision.</h1><p class="jr-hero__lead">Compare Arabella, Mudon Views and Al Ranim around the things that matter after move-in: park access, plot position, household routes, condition, construction stage and the price of the exact home.</p><div class="jr-actions"><a class="jr-button jr-button--light" data-cta="hero-primary" data-location="hero" href="#enquire">Get current Mudon homes</a><a class="jr-text-link" data-cta="hero-secondary" data-location="hero" href="#projects">Compare home types <span aria-hidden="true">↘</span></a></div><ul class="jr-hero__proof"><li>Official Dubai Properties sources</li><li>Resale + assignment checks</li><li>Phase-by-phase review</li></ul><span class="mudon-checked">Community facts checked 17 Aug 2026 · live inventory can change</span></div><p class="jr-hero__independent">Independent James Realty advisory — not Dubai Properties’ official website.</p></div></section>'''
          sub(r'<section class="jr-hero jr-hero--residential".*?</section>',hero,'hero')

          facts='''<section class="jr-facts" aria-label="Mudon at a glance"><div class="jr-shell jr-facts__track"><article><span>01</span><strong>Gated</strong><small>Park-led Dubailand community</small></article><article><span>02</span><strong>Arabella</strong><small>3–4 bedroom townhouses</small></article><article><span>03</span><strong>Mudon Views</strong><small>1–3 bedroom apartments</small></article><article><span>04</span><strong>Al Ranim</strong><small>3–4 bedroom townhouses + family layouts</small></article></div></section>'''
          sub(r'<section class="jr-facts".*?</section>',facts,'facts')

          pathways='''<section class="jr-section mudon-pathways" id="overview"><div class="jr-shell"><header class="jr-heading" data-reveal><p class="jr-kicker">Start with the household, not the phase name</p><h2 class="jr-display">Four filters that change which Mudon home works.</h2><p>Mudon is designed around family living, parks and everyday amenities. The best choice still depends on the exact household routine and the physical position of the home inside the community.</p></header><div class="mudon-pathway-grid"><article class="mudon-pathway-card" data-reveal><span>01 · Route</span><h3>School + work</h3><p>Test the real morning and evening drive rather than relying on off-peak map estimates.</p><strong>Best question: does this street improve or complicate the weekly routine?</strong></article><article class="mudon-pathway-card" data-reveal><span>02 · Position</span><h3>Park + plot</h3><p>Corner, single-row, backing position, park proximity and road exposure can materially change liveability.</p><strong>Compare the exact plot—not only bedrooms and built-up area.</strong></article><article class="mudon-pathway-card" data-reveal><span>03 · Condition</span><h3>Ready-home quality</h3><p>Arabella and Mudon Views opportunities can differ substantially by maintenance, upgrades and fit-out condition.</p><strong>Inspect before assuming two similar listings are equivalent.</strong></article><article class="mudon-pathway-card" data-reveal><span>04 · Phase</span><h3>Al Ranim stage</h3><p>Recent Al Ranim phases are at different construction stages, while several official release pages are marked sold out.</p><strong>Verify whether the opportunity is resale, assignment or developer stock.</strong></article></div></div></section>'''
          sub(r'<section class="jr-section jr-signature".*?</section>',pathways,'pathways')

          projects='''<section class="jr-section jr-project-section" id="projects"><div class="jr-shell"><header class="jr-heading" data-reveal><p class="jr-kicker">Choose the product before the listing</p><h2 class="jr-display">Three distinct ways to live in Mudon.</h2><p>Dubai Properties describes Mudon as a gated Dubailand community with extensive parkland and everyday amenities. Arabella, Mudon Views and Al Ranim serve different households, so compare the product first and the individual home second.</p></header><div class="jr-projects"><article class="jr-project" data-reveal data-project-card="Arabella"><figure><img src="https://jamesrealty.uk/images/projects/mudon-family-townhouses.webp" width="724" height="543" loading="lazy" decoding="async" alt="Representative leafy family townhouse cluster in a Mudon-style Dubai community"><figcaption>James Realty advisory visual — not an official project render</figcaption></figure><div class="jr-project__body"><span class="jr-project__meta">Established · Townhouses</span><h3>Arabella</h3><p>Established three- and four-bedroom townhouses with gardens and private green space. Street position, upgrades and maintenance history deserve as much attention as the floor plan.</p><ul><li>3–4 bedroom townhouses</li><li>Mature family neighbourhood</li><li>Ready-home condition matters</li></ul><div class="jr-project__bottom"><span><strong>Current resale market</strong><small>Compare asking price with transaction evidence</small></span><a class="jr-project__source" data-source-link href="https://www.dp.ae/our-portfolio/all-projects/58/mudon/" target="_blank" rel="noopener noreferrer">Official source ↗</a></div><a class="jr-project__cta" href="#enquire" data-project-select="Arabella">Check Arabella homes <span aria-hidden="true">→</span></a></div></article><article class="jr-project" data-reveal data-project-card="Mudon Views"><figure><img src="https://jamesrealty.uk/images/projects/mudon-community-park.webp" width="724" height="543" loading="lazy" decoding="async" alt="Representative green community park with cycling path and family pavilion"><figcaption>James Realty advisory visual — not an official project render</figcaption></figure><div class="jr-project__body"><span class="jr-project__meta">Apartments · Central Park outlook</span><h3>Mudon Views</h3><p>One- to three-bedroom apartments overlooking the community’s green setting for buyers who want Mudon lifestyle with a lower-maintenance property format.</p><ul><li>1–3 bedroom apartments</li><li>Community and park outlooks</li><li>Review service charges + unit condition</li></ul><div class="jr-project__bottom"><span><strong>Current resale market</strong><small>Building and unit should be compared separately</small></span><a class="jr-project__source" data-source-link href="https://www.dp.ae/our-portfolio/all-projects/58/mudon/" target="_blank" rel="noopener noreferrer">Official source ↗</a></div><a class="jr-project__cta" href="#enquire" data-project-select="Mudon Views">Check Mudon Views homes <span aria-hidden="true">→</span></a></div></article><article class="jr-project" data-reveal data-project-card="Al Ranim"><figure><img src="https://jamesrealty.uk/images/projects/mudon-villa-street.webp" width="724" height="543" loading="lazy" decoding="async" alt="Representative practical villa street with private gardens and mature trees"><figcaption>James Realty advisory visual — not an official project render</figcaption></figure><div class="jr-project__body"><span class="jr-project__meta">Newer phases · Townhouses</span><h3>Mudon Al Ranim</h3><p>Three- and four-bedroom townhouses, including larger family layouts, arranged around park-led community space. Recent phases are at different construction stages.</p><ul><li>3–4 bedroom townhouses</li><li>3–4 bedroom + family layouts</li><li>Phase and contract status must be verified</li></ul><div class="jr-project__bottom"><span><strong>Resale / assignment / stock check</strong><small>Do not rely on old launch availability</small></span><a class="jr-project__source" data-source-link href="https://www.dp.ae/our-portfolio/all-projects/58/mudon/" target="_blank" rel="noopener noreferrer">Official source ↗</a></div><a class="jr-project__cta" href="#enquire" data-project-select="Mudon Al Ranim">Check Al Ranim opportunities <span aria-hidden="true">→</span></a></div></article></div></div></section>'''
          sub(r'<section class="jr-section jr-project-section".*?</section>',projects,'projects')

          mapsec='''<section class="jr-section" id="locations"><div class="jr-shell"><div class="mudon-map-layout"><div class="mudon-map-copy" data-reveal><p class="jr-kicker">Community orientation</p><h2 class="jr-display">Use the map to narrow the shortlist.</h2><p>Mudon sits in Dubailand and is built around parks, community facilities and family housing. The map is useful for orientation; the final decision should still be based on the exact street, access point and household route.</p><div class="mudon-map-list"><div><strong>Arabella</strong><span>Established townhouse neighbourhood</span></div><div><strong>Mudon Views</strong><span>Apartment living near community greenery</span></div><div><strong>Al Ranim</strong><span>Newer townhouse phases around park space</span></div><div><strong>Al Qudra corridor</strong><span>Test real peak-hour access</span></div></div></div><div class="mudon-map-frame" data-reveal><iframe title="Mudon Dubailand community map" src="https://www.openstreetmap.org/export/embed.html?bbox=55.20%2C24.98%2C55.33%2C25.08&amp;layer=mapnik&amp;marker=25.0267%2C55.2636" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div></div></div></section>'''
          sub(r'<section class="jr-section jr-map-section".*?</section>',mapsec,'map')

          status='''<section class="jr-section mudon-status-section" id="construction"><div class="jr-shell"><header class="jr-heading" data-reveal><p class="jr-kicker">Official Q1 2026 construction updates</p><h2 class="jr-display">Recent Al Ranim phases are not all at the same stage.</h2><p>Dubai Properties publishes phase-specific construction progress. These percentages are construction context, not a statement that developer inventory is available.</p></header><div class="mudon-status-grid"><article class="mudon-status-card" data-reveal><span>Phase 5</span><strong>96.13%</strong><h3>Al Ranim 5</h3><p>Official portfolio pages currently mark this release sold out.</p><footer>Construction progress shown by Dubai Properties</footer></article><article class="mudon-status-card" data-reveal><span>Phase 6</span><strong>93.76%</strong><h3>Al Ranim 6</h3><p>Finishing, landscaping and authority inspections were progressing in Q1 2026.</p><footer>Internal inspection dated 10 Mar 2026</footer></article><article class="mudon-status-card" data-reveal><span>Phase 7</span><strong>89.64%</strong><h3>Al Ranim 7</h3><p>Official project and update pages show the phase progressing and the release marked sold out.</p><footer>Internal inspection dated 10 Mar 2026</footer></article><article class="mudon-status-card" data-reveal><span>Phase 8</span><strong>88.27%</strong><h3>Al Ranim 8</h3><p>Finishing, approvals, commissioning and snagging were still advancing in Q1 2026.</p><footer>Internal inspection dated 10 Mar 2026</footer></article></div></div></section>'''
          sub(r'<section class="jr-section jr-day".*?</section>',status,'status')

          html=html.replace('>Community life</a><a href="#projects">Home types</a><a href="#why-invest">Buyer checklist</a><a href="#enquire">Arrange a shortlist</a>','>Community map</a><a href="#projects">Home types</a><a href="#construction">Phase status</a><a href="#enquire">Get shortlist</a>')
          html=html.replace('>Request available Mudon homes</a>','>Get current Mudon homes</a>',1)
          html=html.replace('Mudon family-home advisory','Mudon home and phase advisory')
          html=html.replace('Some official Al Ranim pages are marked sold out. Current stock may be resale, assignment or a later release and must be verified.','Several recent Al Ranim release pages are marked sold out, while other phases are still progressing through construction. Current opportunities should be verified as resale, assignment or developer stock before advice.')
          path.write_text(html,encoding='utf-8')
          PY
      - name: Commit Mudon refresh
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add landing/mudon/index.html
          git commit -m 'Refresh Mudon landing design and current phase information'
          git push origin HEAD:main
