name: Update Yesterday Transactions

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-yesterday-transactions.yml"
      - "scripts/fetch_yesterday_transactions.py"

permissions:
  contents: write

concurrency:
  group: yesterday-transactions
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Fetch previous Dubai day
        run: python scripts/fetch_yesterday_transactions.py

      - name: Publish snapshot when changed
        run: |
          if git diff --quiet -- data/yesterday-transactions.json; then
            echo "Snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yesterday-transactions.json
          git commit -m "Update yesterday Dubai transactions"
          git push
