name: Run Digital conversion rebuild

on:
  push:
    paths:
      - '.github/workflows/run-digital-conversion-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute conversion script from staged workflow
        run: |
          python - <<'RUN'
          from pathlib import Path
          src = Path('.github/workflows/apply-digital-conversion-rebuild.yml').read_text(encoding='utf-8')
          marker = "python - <<'PY'\n"
          parts = src.split(marker)
          if len(parts) < 2:
              raise SystemExit('Expected embedded conversion Python block')
          def normalize(block):
              lines = block.splitlines()
              return '\n'.join((line[10:] if line.startswith('          ') else line) for line in lines).strip() + '\n'
          apply_block = normalize(parts[1].split('\n          PY',1)[0])
          exec(compile(apply_block, '<conversion-apply>', 'exec'), {})

          root = Path('digital')
          required = ['index.html','portfolio.html','results.html','about.html','pricing.html','start-project.html','book-call.html','solutions.html','industries.html','privacy.html','terms.html','conversion-20260830.css','conversion-20260830.js']
          missing = [x for x in required if not (root/x).exists()]
          if missing:
              raise SystemExit('Missing rebuilt assets: ' + ', '.join(missing))
          for p in root.rglob('*.html'):
              text = p.read_text(encoding='utf-8')
              if p.name != '404.html' and '/conversion-20260830.js' not in text:
                  raise SystemExit('Missing conversion JS: ' + str(p))
              if '/start-project.html?route=call' in text:
                  raise SystemExit('Old fake call route remains: ' + str(p))
          pricing = (root/'pricing.html').read_text(encoding='utf-8')
          for old in ['Choose Starter','Choose Growth','Brand Starter','Launch Site</span><h3>$499']:
              if old in pricing:
                  raise SystemExit('Old low-cost pricing UI remains: ' + old)
          print('Digital conversion rebuild validation passed')
          RUN
      - name: Commit conversion rebuild
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digital
          git commit -m 'feat(digital): implement full conversion rebuild' || exit 0
          git push
