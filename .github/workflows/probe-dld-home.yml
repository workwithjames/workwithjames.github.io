name: Probe DLD Public Daily Data
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-dld-home.yml"
      - "scripts/probe_dld_home.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/probe_dld_home.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dld-home-probe.json
          git commit -m "Capture DLD public data module structure" || exit 0
          git push
