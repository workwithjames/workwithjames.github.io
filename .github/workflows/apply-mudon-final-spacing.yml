name: Apply Mudon final spacing
on:
  push:
    paths:
      - '.github/workflows/apply-mudon-final-spacing.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('landing/mudon/index.html')
          s=p.read_text(encoding='utf-8')
          needle='<link rel="stylesheet" href="https://jamesrealty.uk/assets/mudon-premium.css?v=2">'
          extra='<link rel="stylesheet" href="https://jamesrealty.uk/assets/mudon-spacing-final.css?v=1">'
          if extra not in s:
              s=s.replace(needle, needle+extra)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add landing/mudon/index.html
          git commit -m 'Apply final Mudon construction spacing'
          git push origin HEAD:main
