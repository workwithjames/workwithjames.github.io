name: Fix Nakheel schema links
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-nakheel-schema-links.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fix structured project URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('landing/nakheel/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://www.nakheel.com/en/media-centre/press-releases/news-detail/2026/04/27/nakheel-awards-contracts-worth-over-aed-3.5-billion-to-build-544-villas-on-dubai-s-palm-jebel-ali","name":"Bay Villas Dubai Islands"','https://www.nakheel.com/en/construction-progress/bay-villas-dubai-islands","name":"Bay Villas Dubai Islands"')
          s=s.replace('https://www.nakheel.com/en/media-centre/press-releases/news-detail/2026/05/19/nakheel-introduces-a-limited-collection-of-beachfront-homes-at-palm-beach-towers","name":"Bay Grove Residences"','https://www.nakheel.com/en/media-centre/press-releases/news-detail/2025/07/03/nakheel-unveils-final-phase-of-bay-grove-residences-on-dubai-islands","name":"Bay Grove Residences"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit schema correction
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add landing/nakheel/index.html
          git commit -m 'Align Nakheel structured data with current project cards'
          git push origin HEAD:main
