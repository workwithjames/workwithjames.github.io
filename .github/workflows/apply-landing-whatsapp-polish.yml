name: Apply landing WhatsApp and responsive polish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-landing-whatsapp-polish.yml'

permissions:
  contents: write

concurrency:
  group: landing-experience-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current site
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply WhatsApp CTA and responsive polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          landing_slugs = ['emaar','aldar','damac','binghatti','nakheel','mudon','uk','usa','india','ar']
          wa = 'https://wa.me/971528420933'

          # 1) Preserve the existing design system and append only scoped polish.
          css_path = root / 'assets/landing-experience.css'
          css = css_path.read_text(encoding='utf-8')
          marker = '/* JR_CONTACT_POLISH_START */'
          if marker not in css:
              css += r'''

/* JR_CONTACT_POLISH_START */
/* Theme-aware WhatsApp CTA and final responsive rhythm. */
.jr-whatsapp-contact{
  width:max-content;
  max-width:100%;
  gap:10px;
  margin-top:2px;
  border-color:var(--accent-2);
  background:color-mix(in srgb,var(--accent) 28%,transparent);
  color:#fff;
}
.jr-whatsapp-contact:hover,.jr-whatsapp-contact:focus-visible{
  background:var(--accent-2);
  border-color:var(--accent-2);
  color:#111411;
}
.jr-mobile-cta [data-whatsapp-action]{
  border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 10%,transparent);
}
@media (min-width:761px) and (max-width:1100px){
  :root{--section:clamp(58px,7vw,78px)}
  .jr-form-wrap{gap:34px}
  .jr-map{gap:34px}
}
@media(max-width:760px){
  :root{--section:56px}
  .jr-hero{min-height:min(760px,100svh)}
  .jr-hero__inner{
    min-height:calc(min(760px,100svh) - 68px);
    padding-block:clamp(52px,8vh,68px) 30px;
  }
  .jr-form-wrap{gap:28px}
  .jr-form-copy ul{margin:24px 0;padding:18px 0}
  .jr-whatsapp-contact{width:100%;justify-content:center}
  .jr-mobile-cta{grid-template-columns:1.15fr .85fr}
}
@media(max-width:420px){
  :root{--section:52px}
  .jr-hero h1{font-size:clamp(2.85rem,14vw,4.15rem)}
  .jr-faq{gap:26px}
}
/* JR_CONTACT_POLISH_END */
'''
              css_path.write_text(css, encoding='utf-8')

          # 2) Preserve existing analytics and add explicit WhatsApp click tracking.
          js_path = root / 'assets/landing-experience.js'
          js = js_path.read_text(encoding='utf-8')
          if "landing_whatsapp_click" not in js:
              needle = "  qsa('[data-phone-action]').forEach(link=>link.addEventListener('click',()=>track('landing_phone_click',{link_url:link.href})));\n"
              addition = needle + "  qsa('[data-whatsapp-action]').forEach(link=>link.addEventListener('click',()=>track('landing_whatsapp_click',{link_url:link.href,cta_location:link.dataset.location||'page'})));\n"
              if needle not in js:
                  raise SystemExit('Could not locate existing landing phone analytics hook')
              js = js.replace(needle, addition, 1)
              js_path.write_text(js, encoding='utf-8')

          # 3) Update the shared generator baseline so future rebuilds do not restore phone CTAs.
          build_path = root / 'scripts/build_landing_experiences.mjs'
          build = build_path.read_text(encoding='utf-8')
          build = re.sub(r'landing-experience\.css\?v=\d+', 'landing-experience.css?v=9', build)
          build = re.sub(r'landing-experience\.js\?v=\d+', 'landing-experience.js?v=7', build)

          old_v4_form = '''<a class="jr-phone" data-phone-action href="tel:+971528420933">${ar?'اتصال مباشر':'Call James'} · ${PHONE}</a>'''
          new_v4_form = '''<a class="jr-button jr-button--ghost jr-whatsapp-contact" data-whatsapp-action data-location="form" href="${WA}" target="_blank" rel="noopener noreferrer">${ar?'تواصل عبر واتساب':'Chat on WhatsApp'} <span aria-hidden="true">↗</span></a>'''
          old_v4_mobile = '''<a class="jr-button jr-button--ghost" data-phone-action href="tel:+971528420933">${page.arabic?'اتصال':'Call'}</a>'''
          new_v4_mobile = '''<a class="jr-button jr-button--ghost" data-whatsapp-action data-location="mobile-sticky" href="${WA}" target="_blank" rel="noopener noreferrer">${page.arabic?'واتساب':'WhatsApp'} <span aria-hidden="true">↗</span></a>'''
          if old_v4_form not in build or old_v4_mobile not in build:
              raise SystemExit('Could not locate current V4 phone CTA templates')
          build = build.replace(old_v4_form, new_v4_form, 1).replace(old_v4_mobile, new_v4_mobile, 1)

          # Clean the older, unused renderer too so a future refactor cannot reintroduce visible phone numbers.
          old_legacy_contact = '''<div class="jr-contact"><a data-location="form" href="${WA}">${page.arabic?'واتساب':'WhatsApp'} · ${PHONE}</a><a data-location="form" href="tel:+971528420933">${page.arabic?'اتصال مباشر':'Call'} · ${PHONE}</a></div>'''
          new_legacy_contact = '''<div class="jr-contact"><a data-whatsapp-action data-location="form" href="${WA}" target="_blank" rel="noopener noreferrer">${page.arabic?'تواصل عبر واتساب':'Chat on WhatsApp'} ↗</a></div>'''
          build = build.replace(old_legacy_contact, new_legacy_contact)
          build_path.write_text(build, encoding='utf-8')

          # 4) Patch the CURRENT bespoke landing pages in place. Do not regenerate them: several have
          # developer-specific premium CSS and content that is newer than the shared baseline generator.
          tel_anchor = re.compile(r'<a(?P<before>[^>]*)href="tel:\+971528420933"(?P<after>[^>]*)>(?P<label>.*?)</a>', re.S)
          total_replaced = 0
          for slug in landing_slugs:
              path = root / 'landing' / slug / 'index.html'
              text = path.read_text(encoding='utf-8')
              arabic = slug == 'ar'
              text = re.sub(r'landing-experience\.css\?v=\d+', 'landing-experience.css?v=9', text)
              text = re.sub(r'landing-experience\.js\?v=\d+', 'landing-experience.js?v=7', text)

              per_page = 0
              def replace_tel(match):
                  nonlocal_holder[0] += 1
                  attrs = (match.group('before') + ' ' + match.group('after')).lower()
                  is_form_contact = 'jr-phone' in attrs
                  if is_form_contact:
                      label = 'تواصل عبر واتساب' if arabic else 'Chat on WhatsApp'
                      return f'<a class="jr-button jr-button--ghost jr-whatsapp-contact" data-whatsapp-action data-location="form" href="{wa}" target="_blank" rel="noopener noreferrer">{label} <span aria-hidden="true">↗</span></a>'
                  label = 'واتساب' if arabic else 'WhatsApp'
                  return f'<a class="jr-button jr-button--ghost" data-whatsapp-action data-location="mobile-sticky" href="{wa}" target="_blank" rel="noopener noreferrer">{label} <span aria-hidden="true">↗</span></a>'

              nonlocal_holder = [0]
              text = tel_anchor.sub(replace_tel, text)
              per_page = nonlocal_holder[0]
              total_replaced += per_page

              if per_page < 2:
                  raise SystemExit(f'{slug}: expected at least form + mobile phone CTAs, replaced {per_page}')
              if 'href="tel:' in text:
                  raise SystemExit(f'{slug}: a telephone CTA remains')
              if '+971 52 842 0933' in text:
                  raise SystemExit(f'{slug}: a visible raw James Realty phone number remains')
              if text.count('data-whatsapp-action') < 2:
                  raise SystemExit(f'{slug}: WhatsApp CTAs are missing')
              if 'landing-experience.css?v=9' not in text or 'landing-experience.js?v=7' not in text:
                  raise SystemExit(f'{slug}: cache-busted shared assets are missing')
              # Image hygiene: preserve descriptive alternatives and loading strategy.
              for tag in re.findall(r'<img\b[^>]*>', text, re.I):
                  if not re.search(r'\balt="[^"]+"', tag, re.I):
                      raise SystemExit(f'{slug}: image without descriptive alt text: {tag[:100]}')
              path.write_text(text, encoding='utf-8')

          print(f'Converted {total_replaced} visible phone CTAs to WhatsApp across {len(landing_slugs)} landing pages.')

          # 5) Expand live browser QA to the actual changed files and all four requested viewport classes.
          verify_path = root / '.github/workflows/verify-live-landing-layout.yml'
          verify = verify_path.read_text(encoding='utf-8')
          verify = verify.replace("      - '.github/workflows/verify-live-landing-layout.yml'", "      - '.github/workflows/verify-live-landing-layout.yml'\n      - 'assets/landing-experience.css'\n      - 'assets/landing-experience.js'\n      - 'landing/**/index.html'\n      - 'scripts/build_landing_experiences.mjs'")
          verify = verify.replace('cssV8', 'cssV9').replace('landing-experience.css?v=8', 'landing-experience.css?v=9')
          verify = verify.replace("await page.setViewport({ width: 390, height: 844, deviceScaleFactor: 1 });", "const intermediate = [];\n            for (const viewport of [{width:1024,height:850,name:'laptop'},{width:768,height:1024,name:'tablet'}]) {\n              await page.setViewport({ width: viewport.width, height: viewport.height, deviceScaleFactor: 1 });\n              await page.reload({ waitUntil:'networkidle2', timeout:45000 });\n              const result = await metrics(page);\n              intermediate.push({name:viewport.name, overflow:result.overflow});\n            }\n\n            await page.setViewport({ width: 390, height: 844, deviceScaleFactor: 1 });")
          verify = verify.replace("mobileOverflow: mobile.overflow <= 2,", "laptopOverflow: (intermediate.find(x=>x.name==='laptop')?.overflow ?? 999) <= 2,\n              tabletOverflow: (intermediate.find(x=>x.name==='tablet')?.overflow ?? 999) <= 2,\n              mobileOverflow: mobile.overflow <= 2,")
          verify = verify.replace("mobile: {\n                overflow:", "intermediate,\n              mobile: {\n                overflow:")
          verify_path.write_text(verify, encoding='utf-8')
          PY

      - name: Run static landing audit
        run: node scripts/audit_landing_experiences.mjs

      - name: Verify scoped changes
        shell: bash
        run: |
          set -euo pipefail
          for page in emaar aldar damac binghatti nakheel mudon uk usa india ar; do
            file="landing/$page/index.html"
            ! grep -q 'href="tel:' "$file"
            ! grep -q '+971 52 842 0933' "$file"
            grep -q 'data-whatsapp-action' "$file"
            grep -q 'landing-experience.css?v=9' "$file"
            grep -q 'landing-experience.js?v=7' "$file"
          done
          git diff --check

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/landing-experience.css assets/landing-experience.js scripts/build_landing_experiences.mjs landing .github/workflows/verify-live-landing-layout.yml
          if git diff --cached --quiet; then
            echo "Landing pages already contain the requested polish."
            exit 0
          fi
          git commit -m "Convert landing phone CTAs to WhatsApp and tighten responsive spacing"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Could not publish landing-page polish after retries." >&2
          exit 1
