name: Apply landing WhatsApp and responsive polish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-landing-whatsapp-polish.yml'
      - 'scripts/apply_landing_whatsapp_polish.py'
      - 'scripts/landing-polish-trigger.txt'

permissions:
  contents: write

concurrency:
  group: landing-experience-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current site
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply scoped landing polish
        run: python scripts/apply_landing_whatsapp_polish.py

      - name: Verify requested CTA and asset rules
        shell: bash
        run: |
          set -euo pipefail
          for page in emaar aldar damac binghatti nakheel mudon uk usa india ar; do
            file="landing/$page/index.html"
            ! grep -q 'href="tel:' "$file"
            ! grep -q '+971 52 842 0933' "$file"
            grep -q 'data-whatsapp-action' "$file"
            grep -q 'landing-experience.css?v=9' "$file"
            grep -q 'landing-experience.js?v=7' "$file"
          done
          git diff --check

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/landing-experience.css assets/landing-experience.js scripts/build_landing_experiences.mjs landing .github/workflows/verify-live-landing-layout.yml
          if git diff --cached --quiet; then
            echo "Landing pages already contain the requested polish."
            exit 0
          fi
          git commit -m "Convert landing phone CTAs to WhatsApp and tighten responsive spacing"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Could not publish landing-page polish after retries." >&2
          exit 1
