name: Remove Property Finder automation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-propertyfinder.yml'

permissions:
  contents: write

concurrency:
  group: property-news-autopublish
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Property Finder automation and articles
        run: python scripts/remove_propertyfinder_automation.py

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Property Finder automation and articles"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

# One-time cleanup trigger: 2026-08-02
