name: Publish Digital profile image

on:
  push:
    branches: [main]
    paths:
      - '.automation/profile-image/**'
      - '.github/workflows/publish-digital-profile-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record staged chunk checksums
        run: |
          {
            wc -c .automation/profile-image/part-*.b64
            sha256sum .automation/profile-image/part-*.b64
            echo "part-01-first16000"
            head -c 16000 .automation/profile-image/part-01.b64 | sha256sum
          } > .automation/profile-image-diagnostics.txt

      - name: Commit diagnostics
        run: |
          git add .automation/profile-image-diagnostics.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(digital): record portrait staging checksums"
          git push
