name: Publish Digital profile image

on:
  push:
    branches: [main]
    paths:
      - '.automation/profile-image/**'
      - '.github/workflows/publish-digital-profile-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode high-resolution profile image
        run: |
          cat .automation/profile-image/part-*.b64 | base64 --decode > digital/assets/james-ravi-profile.webp
          file digital/assets/james-ravi-profile.webp
          test "$(stat -c%s digital/assets/james-ravi-profile.webp)" -gt 40000

      - name: Commit profile image
        run: |
          git add digital/assets/james-ravi-profile.webp
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(digital): restore sharp About portrait"
          git push
