name: Publish official UAE updates

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-uae-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-official-news.txt

      - name: Install monitor dependencies
        run: pip install -r requirements-official-news.txt

      - name: Check official sources and publish new alerts
        run: python scripts/import_official_news.py

      - name: Commit website updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official-news-state.json blog/index.html blog/official-updates feed.xml sitemap.xml
          if git diff --cached --quiet; then
            echo "No website changes detected."
          else
            git commit -m "Publish official UAE news updates"
            git push
          fi
