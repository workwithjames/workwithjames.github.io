name: Publish official UAE updates

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-official-news.yml'
      - 'scripts/import_official_news.py'
      - 'scripts/upgrade_official_news_images.py'

permissions:
  contents: write

# Official updates and property briefs both modify generated website files. Keep
# those repository writes in one queue so they cannot overwrite each other.
concurrency:
  group: site-content-writes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-official-news.txt

      - name: Install monitor dependencies
        run: pip install -r requirements-official-news.txt

      - name: Tune monitor network retries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/import_official_news.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('for i in range(3):', 'for i in range(2):', 1)
          text = text.replace('S.get(u,timeout=30,', 'S.get(u,timeout=12,', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate publisher scripts
        run: |
          python -m py_compile scripts/import_official_news.py
          python -m py_compile scripts/upgrade_official_news_images.py

      - name: Check official sources and publish new alerts
        run: python scripts/import_official_news.py

      - name: Add editorial imagery to official alerts
        run: python scripts/upgrade_official_news_images.py

      - name: Commit website updates
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official-news-state.json blog/index.html feed.xml sitemap.xml
          if [ -d blog/official-updates ]; then
            git add -A blog/official-updates
          fi
          if git diff --cached --quiet; then
            echo "No website changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish official UAE news updates"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify search engines about published updates
        if: steps.publish.outputs.changed == 'true'
        run: python scripts/submit_indexnow.py --diff HEAD^ HEAD || echo "IndexNow notification will be retried on the next website push."
