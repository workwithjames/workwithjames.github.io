name: Verify DAMAC premium landing
on:
  push:
    paths:
      - '.github/workflows/verify-damac-premium.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install browser driver
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24 >/dev/null 2>&1
      - name: Verify live DAMAC layout and content
        shell: bash
        run: |
          cat > damac-qa.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import {execSync} from 'node:child_process';
          const chrome=execSync('which google-chrome || which chromium || which chromium-browser').toString().trim();
          const browser=await puppeteer.launch({headless:true,executablePath:chrome,args:['--no-sandbox']});
          const page=await browser.newPage();
          const capture=async(width,height)=>{
            await page.setViewport({width,height,deviceScaleFactor:1});
            let d;
            for(let i=0;i<22;i++){
              await page.goto(`https://damac.jamesrealty.uk/?damacqa=${Date.now()}-${i}`,{waitUntil:'networkidle2',timeout:45000});
              d=await page.evaluate(()=>{
                const hs=s=>[...document.querySelectorAll(s)].map(e=>Math.round(e.getBoundingClientRect().height));
                const styles=[...document.querySelectorAll('link[rel="stylesheet"]')].map(e=>e.href);
                return {
                  css:styles.some(x=>x.includes('damac-premium.css?v=1')),
                  title:document.querySelector('h1')?.textContent?.trim()||'',
                  text:document.body.innerText,
                  overflow:document.documentElement.scrollWidth-window.innerWidth,
                  hero:hs('.jr-hero'),facts:hs('.jr-facts__track article'),projects:hs('.jr-project'),projectBodies:hs('.jr-project__body'),current:hs('.damac-current-grid'),notes:hs('.damac-current-notes article'),lens:hs('.jr-lens__grid article'),process:hs('.jr-process__rail li')
                };
              });
              if(d.css && d.title.includes('Luxury should hold up')) return d;
              await new Promise(r=>setTimeout(r,15000));
            }
            return d;
          };
          const desktop=await capture(1440,1000);
          const mobile=await capture(390,844);
          const max=a=>a?.length?Math.max(...a):0;
          const checks={
            css:desktop.css&&mobile.css,
            heroCopy:desktop.title.includes('Luxury should hold up'),
            currentFacts:desktop.text.includes('DAMAC Islands 2')&&desktop.text.includes('Safa Gate')&&desktop.text.includes('20 million sq ft')&&desktop.text.includes('1–2 bedroom apartments'),
            desktopOverflow:desktop.overflow<=2,
            mobileOverflow:mobile.overflow<=2,
            heroHeight:max(desktop.hero)<=900,
            facts:max(desktop.facts)<=125,
            projectBodies:max(desktop.projectBodies)<=460,
            current:max(desktop.current)<=500,
            notes:max(desktop.notes)<=220,
            lens:max(desktop.lens)<=150,
            process:max(desktop.process)<=180
          };
          console.log('DAMAC_PREMIUM_QA|'+JSON.stringify({checks,desktop,mobile}));
          await browser.close();
          if(!Object.values(checks).every(Boolean)) process.exit(1);
          JS
          node damac-qa.mjs
