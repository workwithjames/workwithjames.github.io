name: Deploy James SEO Preview

on:
  push:
    branches:
      - feature/seo-saas-mvp
    paths:
      - "seo-saas/**"
      - ".github/workflows/deploy-seo-saas-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: james-seo-preview
  cancel-in-progress: true

jobs:
  deploy:
    name: Provision data, migrate and deploy SEO SaaS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Wrangler
        working-directory: seo-saas
        run: npm install --no-audit --no-fund

      - name: Validate application
        working-directory: seo-saas
        run: npm run check

      - name: Provision D1 database and build runtime config
        working-directory: seo-saas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cp wrangler.jsonc wrangler.runtime.json
          D1_LIST="$(npx wrangler d1 list --json)"
          DB_ID="$(printf '%s' "$D1_LIST" | node -e '
            let raw="";
            process.stdin.on("data", d => raw += d);
            process.stdin.on("end", () => {
              const dbs = JSON.parse(raw || "[]");
              const db = dbs.find(d => d.name === "james-seo-db");
              process.stdout.write(db ? (db.uuid || db.database_id || db.id || "") : "");
            });
          ')"

          if [ -z "$DB_ID" ]; then
            echo "Creating james-seo-db in Cloudflare D1..."
            npx wrangler d1 create james-seo-db --location apac --binding DB --update-config --config wrangler.runtime.json
            D1_LIST="$(npx wrangler d1 list --json)"
            DB_ID="$(printf '%s' "$D1_LIST" | node -e '
              let raw="";
              process.stdin.on("data", d => raw += d);
              process.stdin.on("end", () => {
                const dbs = JSON.parse(raw || "[]");
                const db = dbs.find(d => d.name === "james-seo-db");
                process.stdout.write(db ? (db.uuid || db.database_id || db.id || "") : "");
              });
            ')"
          fi

          if [ -z "$DB_ID" ]; then
            echo "Could not resolve the D1 database ID. Check that CLOUDFLARE_API_TOKEN has D1 Edit permission." >&2
            exit 1
          fi

          node - "$DB_ID" <<'NODE'
          const fs = require('fs');
          const dbId = process.argv[2];
          const path = 'wrangler.runtime.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.d1_databases = [{ binding: 'DB', database_name: 'james-seo-db', database_id: dbId, migrations_dir: 'migrations' }];
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Apply D1 migrations
        working-directory: seo-saas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.runtime.json

      - name: Verify D1 schema
        working-directory: seo-saas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.runtime.json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','sessions','workspaces','workspace_members','projects','audits','audit_pages','usage_events','gsc_connections','gsc_syncs','gsc_query_rows','gsc_page_rows') ORDER BY name;"

      - name: Deploy James SEO SaaS
        working-directory: seo-saas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --minify --config wrangler.runtime.json

      - name: Configure optional Google Search Console secrets
        working-directory: seo-saas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_TOKEN_ENCRYPTION_KEY: ${{ secrets.GSC_TOKEN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${GSC_CLIENT_ID:-}" ] && [ -n "${GSC_CLIENT_SECRET:-}" ] && [ -n "${GSC_TOKEN_ENCRYPTION_KEY:-}" ]; then
            printf '%s' "$GSC_CLIENT_ID" | npx wrangler secret put GSC_CLIENT_ID --config wrangler.runtime.json
            printf '%s' "$GSC_CLIENT_SECRET" | npx wrangler secret put GSC_CLIENT_SECRET --config wrangler.runtime.json
            printf '%s' "$GSC_TOKEN_ENCRYPTION_KEY" | npx wrangler secret put GSC_TOKEN_ENCRYPTION_KEY --config wrangler.runtime.json
            echo "GSC_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Google Search Console Worker secrets configured."
          else
            echo "GSC_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "Google Search Console credentials are not in repository secrets yet; deploying the setup state."
          fi

      - name: Verify deployed platform
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            BODY="$(curl -fsS --max-time 15 https://seo.jamesrealty.uk/api/health || true)"
            echo "Health response: $BODY"
            if printf '%s' "$BODY" | node -e '
              let raw="";
              process.stdin.on("data", d => raw += d);
              process.stdin.on("end", () => {
                try {
                  const h = JSON.parse(raw);
                  process.exit(h.ok === true && h.database === true ? 0 : 1);
                } catch { process.exit(1); }
              });
            '; then
              echo "Database binding verified on deployed Worker."
              exit 0
            fi
            sleep 5
          done
          echo "Worker deployed but the platform health check did not pass." >&2
          exit 1

      - name: Deployment summary
        if: ${{ success() }}
        run: |
          echo "## James SEO SaaS deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`james-seo-mvp\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Custom domain: https://seo.jamesrealty.uk" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1: \`james-seo-db\` migrations applied" >> "$GITHUB_STEP_SUMMARY"
          echo "- Search Console schema and product UI deployed" >> "$GITHUB_STEP_SUMMARY"
          if [ "${GSC_CONFIGURED:-false}" = "true" ]; then
            echo "- Google Search Console OAuth secrets: configured" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Google Search Console OAuth secrets: setup required" >> "$GITHUB_STEP_SUMMARY"
          fi
