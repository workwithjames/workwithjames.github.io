name: Deploy James SEO Preview

on:
  push:
    branches:
      - feature/seo-saas-mvp
    paths:
      - "seo-saas/**"
      - ".github/workflows/deploy-seo-saas-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: james-seo-preview
  cancel-in-progress: true

jobs:
  deploy:
    name: Provision D1, migrate and deploy SEO SaaS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Wrangler
        working-directory: seo-saas
        run: npm install --no-audit --no-fund

      - name: Validate application
        working-directory: seo-saas
        run: npm run check

      - name: Provision D1 database and build runtime config
        working-directory: seo-saas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          D1_LIST="$(npx wrangler d1 list --json)"
          DB_ID="$(printf '%s' "$D1_LIST" | jq -r '.[] | select(.name == "james-seo-db") | .uuid' | head -n 1)"

          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Creating james-seo-db in Cloudflare D1..."
            npx wrangler d1 create james-seo-db --location apac
            D1_LIST="$(npx wrangler d1 list --json)"
            DB_ID="$(printf '%s' "$D1_LIST" | jq -r '.[] | select(.name == "james-seo-db") | .uuid' | head -n 1)"
          fi

          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Could not resolve the D1 database UUID." >&2
            exit 1
          fi

          jq --arg dbid "$DB_ID" '.d1_databases = [{"binding":"DB","database_name":"james-seo-db","database_id":$dbid,"migrations_dir":"migrations"}]' wrangler.jsonc > wrangler.runtime.json
          echo "D1 runtime binding prepared."

      - name: Apply D1 migrations
        working-directory: seo-saas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply james-seo-db --remote --config wrangler.runtime.json

      - name: Deploy James SEO SaaS
        working-directory: seo-saas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --minify --config wrangler.runtime.json

      - name: Deployment summary
        if: ${{ success() }}
        run: |
          echo "## James SEO SaaS deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`james-seo-mvp\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Custom domain: https://seo.jamesrealty.uk" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1: \`james-seo-db\` migrations applied" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authentication, workspaces, projects and persistent audits enabled" >> "$GITHUB_STEP_SUMMARY"
